<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seek First</title>
<meta name="description" content="A 15-minute daily devotions guide: reading plan, prayer rotation, memory verses, a journal prompt, and a Bible story for the kids.">
<meta name="theme-color" content="#f3f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no,date=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seek First">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<style>
:root{
  --bg:#f3f4f0; --surface:#ffffff; --ink:#141a17; --ink-2:#4f5a54; --ink-3:#7d877f;
  --line:#d9ddd6; --line-2:#e8ebe6; --pine:#20372e; --pine-ink:#f3f4f0; --pine-soft:#e3eae5;
  --gold:#8a6512; --gold-fill:#f9c045; --good:#2f6b45; --danger:#9a3b2e;
  --h0:#e6e9e3; --h1:#cfdcd4; --h2:#a9c4b3; --h3:#7ea892; --h4:#4f8069; --h5:#20372e;
  --serif:"Literata",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1a221e; --ink:#ebe8de; --ink-2:#b0b8b1; --ink-3:#7f8a82;
    --line:#2c3730; --line-2:#222c26; --pine:#2f4a3e; --pine-ink:#f3f4f0; --pine-soft:#1f2c26;
    --gold:#f9c045; --gold-fill:#f9c045; --good:#7fc39a; --danger:#e08a7c; color-scheme:dark;
    --h0:#222c26; --h1:#2c4437; --h2:#3a5d4a; --h3:#4f7d63; --h4:#75a98a; --h5:#a8d6bb;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a221e; --ink:#ebe8de; --ink-2:#b0b8b1; --ink-3:#7f8a82;
  --line:#2c3730; --line-2:#222c26; --pine:#2f4a3e; --pine-ink:#f3f4f0; --pine-soft:#1f2c26;
  --gold:#f9c045; --gold-fill:#f9c045; --good:#7fc39a; --danger:#e08a7c; color-scheme:dark;
  --h0:#222c26; --h1:#2c4437; --h2:#3a5d4a; --h3:#4f7d63; --h4:#75a98a; --h5:#a8d6bb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-inline:max(20px,env(safe-area-inset-left)) max(20px,env(safe-area-inset-right));
  padding-block:env(safe-area-inset-top) calc(64px + env(safe-area-inset-bottom));
  min-height:100vh;min-height:100svh;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,a,label,summary,input,select,textarea{touch-action:manipulation}
button,a,summary{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;max-width:100%}
textarea{resize:vertical;min-height:140px;font-family:var(--serif);font-size:17px;line-height:1.6}
select{appearance:auto}
.wrap{max-width:620px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-block:22px 8px;border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;letter-spacing:.01em;color:var(--ink)}
.wordmark small{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:10px;letter-spacing:.02em}
.nav a,.nav button{font-size:13px;color:var(--ink-2);text-decoration:none;letter-spacing:.02em;padding:6px 0}
@media (hover:hover){.nav a:hover,.nav button:hover{color:var(--ink)}}
.nav a:active,.nav button:active{color:var(--ink)}
/* progress strip */
.steps{display:flex;gap:4px;padding-block:18px 6px;list-style:none;margin:0;padding-inline:0}
.steps li{flex:1;min-width:0}
.steps button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px 2px;border-radius:4px}
.steps .bar{display:block;width:100%;height:3px;background:var(--line);border-radius:2px}
.steps .lbl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.steps li.done .bar{background:var(--gold-fill)}
.steps li.cur .bar{background:var(--pine)}
.steps li.cur.done .bar{background:var(--gold-fill)}
.steps li.cur .lbl{color:var(--ink);font-weight:600}
.steps li.done .lbl::after{content:" ✓";color:var(--gold)}
/* step section */
.step{padding-block:22px 0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.2;margin:0 0 6px;text-wrap:balance;letter-spacing:-.005em}
h2{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.25;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.muted{color:var(--ink-2)}
.tiny{font-size:13px;color:var(--ink-3)}
.scripture{font-family:var(--serif);font-size:18px;line-height:1.65;max-width:62ch;margin:14px 0 0}
.scripture p{margin:0 0 .9em}
.scripture sup{font-family:var(--sans);font-size:10px;color:var(--ink-3);margin-right:4px;vertical-align:.45em;letter-spacing:0}
.scripture .chap{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:1.4em 0 .6em}
.scripture .chap:first-child{margin-top:.2em}
.verse-block{font-family:var(--serif);font-size:20px;line-height:1.55;max-width:60ch;margin:10px 0 0}
.verse-block.hidden{filter:blur(7px);user-select:none;pointer-events:none}
.ref{font-family:var(--serif);font-weight:500;font-size:24px;margin:0}
.ref .tr-tag{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.07em;color:var(--ink-3);margin-left:9px;vertical-align:.3em}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.actions select.mini{width:auto;max-width:9em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px}
@media (hover:hover){.btn:hover{border-color:var(--ink-3)}}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.08)}}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding-inline:8px}
@media (hover:hover){.btn.quiet:hover{color:var(--ink)}}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--danger)}
.done-row{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.done-row .btn.primary{min-width:180px}
.list{display:flex;flex-direction:column;gap:0;margin:8px 0 0}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line-2);align-items:start}
.item:first-child{border-top:0}
.item .who{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.3}
.item .what{color:var(--ink-2);font-size:15px;line-height:1.45;max-width:58ch}
.item .meta{font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.item .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.item.prayed .who{color:var(--ink-3)}
.item.prayed .who::after{content:" ✓";color:var(--gold)}
.chip{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--pine-soft);padding:2px 8px;border-radius:999px;margin-right:6px}
.form{display:grid;gap:10px;margin-top:18px;padding:16px;border:1px dashed var(--line);border-radius:10px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.form .row{grid-template-columns:1fr}}
.form label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.empty{padding:22px 0 6px;color:var(--ink-2);font-family:var(--serif);font-size:17px;max-width:52ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:14px}
.card + .card{margin-top:10px}
.card .eyebrow{margin-bottom:2px}
.review-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.save-state{font-size:12px;color:var(--ink-3);min-width:60px;text-align:right}
.finish{padding-block:48px 20px;text-align:left}
.finish h1{font-size:34px}
.finish .verse-block{margin-top:22px}
.finish .cite{font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-top:8px;letter-spacing:.03em}
/* manage */
.manage section{padding-block:26px;border-bottom:1px solid var(--line)}
.manage section:last-child{border-bottom:0}
.manage .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:480px){.manage .row2{grid-template-columns:1fr}}
.manage label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.tms-list{display:flex;flex-direction:column}
.tms-list .series{font-family:var(--serif);font-weight:500;font-size:17px;margin:18px 0 4px}
.tms-list .series:first-child{margin-top:8px}
.tms-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:9px 0;border-top:1px solid var(--line-2);align-items:center;font-size:14px}
.tms-row .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tms-row .t{color:var(--ink-3);font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.tms-row .st{font-size:12px;color:var(--ink-3)}
.tms-row .st.learning{color:var(--gold)} .tms-row .st.review{color:var(--good)}
.jlist{display:flex;flex-direction:column}
.jlist details{border-top:1px solid var(--line-2);padding:8px 0}
.jlist summary{cursor:pointer;font-weight:500}
.jlist summary span{color:var(--ink-3);font-weight:400;font-size:13px;margin-left:10px}
.jlist .body{font-family:var(--serif);font-size:16px;white-space:pre-wrap;color:var(--ink-2);margin-top:8px}
.notice{font-size:13px;color:var(--ink-3);margin-top:10px}
.nav{display:flex;gap:16px}
.nav a{white-space:nowrap}
@media (max-width:480px){.wordmark small{display:none}.nav{gap:12px}}
/* chat */
.chat{margin-top:18px}
.chat .log{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.chat .msg{max-width:88%;padding:9px 13px;border-radius:14px;font-size:15px;line-height:1.45}
.chat .msg.me{align-self:flex-end;background:var(--pine);color:var(--pine-ink);border-bottom-right-radius:4px}
.chat .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat .msg.bot .act{display:block;margin-top:4px}
.chat .msg.bot .act button{color:var(--gold);font-size:13px;margin-left:8px;text-decoration:underline}
.chat .msg.bot .act .k{font-weight:600}
.chat .msg.thinking{color:var(--ink-3);font-style:italic}
.chat .row{display:flex;gap:8px}
.chat .row input{flex:1;font-size:16px;border-radius:22px;padding:11px 16px}
.chat .row .btn{border-radius:22px;padding-inline:18px}
.chat .hint{font-size:13px;color:var(--ink-3);margin-top:8px}
details.formwrap{margin-top:14px}
details.formwrap summary{font-size:13px;color:var(--ink-3);cursor:pointer}
details.formwrap .form{margin-top:8px}
/* progress */
.prog section{padding-block:24px;border-bottom:1px solid var(--line)}
.prog section:last-child{border-bottom:0}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:22px 6px}
@media (max-width:480px){.hero{gap:8px}}
.hero .n{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;margin-top:14px;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:4px}
.heat .c{width:14px;height:14px;border-radius:3px;background:var(--h0)}
.heat .c[data-n="1"]{background:var(--h1)} .heat .c[data-n="2"]{background:var(--h2)} .heat .c[data-n="3"]{background:var(--h3)} .heat .c[data-n="4"]{background:var(--h4)} .heat .c[data-n="5"]{background:var(--h5)}
.heat .c.future{background:transparent;border:1px dashed var(--line)}
.heat .c.today{outline:2px solid var(--gold-fill);outline-offset:1px}
.heat-cap{font-size:13px;color:var(--ink-2);margin-top:8px;min-height:20px;font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);margin-top:8px}
.legend .c{width:12px;height:12px;border-radius:3px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;margin-top:14px}
.bar-row .name{font-weight:500}
.bar-row .val{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar-row .track{grid-column:1/-1;height:8px;background:var(--h0);border-radius:4px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--h5);border-radius:4px;min-width:2px}
.bar-row .sub{grid-column:1/-1;font-size:13px;color:var(--ink-3)}
.dots{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-top:12px}
.dots .sname{font-size:12px;color:var(--ink-3);letter-spacing:.03em;white-space:nowrap}
.dots .rowd{display:flex;gap:5px;flex-wrap:wrap}
.dots .d{width:16px;height:16px;border-radius:50%;background:var(--h0);border:2px solid transparent}
.dots .d.review{background:var(--h5)} .dots .d.learning{border-color:var(--gold-fill);background:transparent} .dots .d.paused{border-color:var(--ink-3);background:transparent}
.miles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mile{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3)}
.mile.hit{border-color:var(--gold-fill);color:var(--ink);background:color-mix(in srgb,var(--gold-fill) 18%,transparent)}
.mile.hit::before{content:"✓ ";color:var(--gold)}
/* print sheet */
.sheet{background:var(--surface);border:1px solid var(--line);padding:26px 28px;margin-top:16px;font-size:14px;line-height:1.4}
.sheet .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.sheet .mast .wm{font-family:var(--serif);font-style:italic;font-size:20px}
.sheet .mast .dt{font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
@media (max-width:560px){.sheet .cols{grid-template-columns:1fr}}
.sheet .blk{margin-bottom:14px;break-inside:avoid}
.sheet h4{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 5px;padding-bottom:3px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.sheet .big{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.25;margin:0 0 4px}
.sheet .v{font-family:var(--serif);font-size:14px;line-height:1.45;margin:4px 0}
.sheet .box{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ink);border-radius:2px;vertical-align:-1px;margin-right:7px}
.sheet .pl{margin:0;padding:0;list-style:none}
.sheet .pl li{padding:3px 0;font-size:13.5px}
.sheet .pl li .w{color:var(--ink-2)}
.sheet .line{border-bottom:1px solid var(--line);height:20px}
.sheet .line.wide{height:24px}
.sheet .small{font-size:12px;color:var(--ink-3)}
.sheet .passage{margin-top:8px;column-count:2;column-gap:22px;font-family:var(--serif);font-size:12.5px;line-height:1.45}
.sheet .passage p{margin:0 0 .6em}
.sheet .passage sup{font-family:var(--sans);font-size:8px;color:var(--ink-3);margin-right:2px}
.sheet .passage .chap{column-span:all;font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 4px}
@media (max-width:560px){.sheet .passage{column-count:1}}

/* ---- phones ---- */
@media (max-width:560px){
  header{flex-wrap:wrap;align-items:center;gap:2px 12px;padding-block:16px 8px}
  .nav{gap:16px;width:100%;flex-wrap:wrap}
  .nav a,.nav button{font-size:14px;padding:8px 0}
  .wordmark small{display:inline;margin-left:8px}  /* nav wraps to its own line, so the date fits again */
  .steps{gap:3px;padding-block:14px 4px}
  .steps button{padding:8px 1px;gap:7px}
  .steps .lbl{font-size:11px;letter-spacing:.02em}
  h1{font-size:26px}
  h2{font-size:20px}
  .finish h1{font-size:28px}
  .scripture{font-size:17px}
  .verse-block{font-size:19px}
  .ref{font-size:21px}
  /* label-and-buttons rows stack instead of squeezing the text into a sliver */
  .item,.tms-row{grid-template-columns:1fr}
  .item .side,.tms-row .side{justify-content:flex-start}
  .item .side{margin-top:2px}
  .card{padding:16px}
  .form{padding:14px}
  .sheet{padding:18px 16px}
  .sheet .mast{flex-wrap:wrap;gap:2px 10px}
  .sheet .mast .wm{white-space:nowrap}
  .dots{grid-template-columns:1fr;gap:4px;align-items:start}
  .dots .sname{margin-top:10px;white-space:normal}
  .hero{gap:10px}
  .hero .n{font-size:34px}
  .done-row{gap:10px}
  .done-row .actions{width:100%}
  .done-row .btn.primary{min-width:0;flex:1}
  .chat .msg{max-width:92%}
}
/* touch: Apple's 44px target, and a calendar you can actually hit */
@media (pointer:coarse){
  .btn.sm{min-height:40px;padding:0 14px}
  .nav a,.nav button{min-height:40px;display:inline-flex;align-items:center}
  .jlist summary,details.formwrap summary{padding-block:6px}
  .heat{grid-template-rows:repeat(7,16px);grid-auto-columns:16px}
  .heat .c{width:16px;height:16px}
}
@media print{
  @page{margin:13mm 14mm}
  html,body{background:#fff!important;color:#000!important;padding:0!important;font-size:12.5px}
  header,.noprint{display:none!important}
  .wrap{max-width:none}
  .sheet{border:0;padding:0;margin:0;color:#000;--ink:#000;--ink-2:#222;--ink-3:#555;--line:#999;--surface:#fff;--bg:#fff;--h0:#eee;--h5:#000}
  .sheet .cols{grid-template-columns:1fr 1fr}
  .sheet .passage{column-count:2}
  a{color:inherit;text-decoration:none}
}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.verse-block{transition:filter .25s ease}}
</style>

<div class="wrap">
  <header>
    <div class="wordmark">Seek First <small id="dateLabel"></small></div>
    <nav class="nav"><a href="#" id="navToday">← Today</a><a href="#progress" id="navProgress">Progress</a><a href="#print" id="navPrint">Print</a><a href="#manage" id="navManage">Manage</a></nav>
  </header>

/* ---------- dates ---------- */
/*#region dates*/
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (key,n) => { const [y,m,d]=key.split('-').map(Number); const t=new Date(y,m-1,d+n); return dayKey(t); };
const daysBetween = (a,b) => { const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5); };
const shortDate = key => { const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
const ago = key => { if(!key) return 'never'; const n=daysBetween(key,dayKey()); return n===0?'today':n===1?'yesterday':`${n} days ago`; };
const longDate = () => new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
/*#endregion*/

/* ---------- state ---------- */
const defaultState = () => ({
  v:1, updatedAt:0,
  plan:{id:'nt', pos:[0], perDay:1},
  prayer:{items:[], perDay:4},
  memory:{cards:[], nextTms:0},
  kids:{pos:0},
  settings:{parser:'auto', readTranslation:'asv', memoryTranslation:'asv'},
  history:{},
  today:{date:'', done:{}, prayIds:[], promptShift:0, recited:false, prayed:0, reviewed:0},
});
let S = defaultState();
let currentStep = 0;
let stepChosen = false;

function ensureToday(){
  const k = dayKey();
  if (S.today.date !== k) S.today = {date:k, done:{}, prayIds:[], promptShift:0, recited:false, prayed:0, reviewed:0};
  if (!S.plan.pos || S.plan.pos.length !== PLANS[S.plan.id].tracks.length) S.plan.pos = PLANS[S.plan.id].tracks.map(()=>0);
}

/* ---------- storage: artifact db when present, localStorage otherwise ---------- */
const LS_STATE = 'seekfirst.state';
const store = {
  db:null, sample:null, unsub:null, saveTimer:null,
  readLocal(){ try{ const s=localStorage.getItem(LS_STATE); return s?JSON.parse(s):null }catch{ return null } },
  writeLocal(){ try{ localStorage.setItem(LS_STATE, JSON.stringify(S)) }catch{} },
  async init(){
    if (window.claude?.use) window.claude.use('sample').then(s=>{ this.sample = s; }).catch(()=>{});
    try { this.db = window.claude?.use ? await window.claude.use('db') : null; } catch { this.db = null; }
    if (!this.db) return;
    const ref = this.db.doc('seekfirst/state');
    try {
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && (remote.updatedAt||0) >= (S.updatedAt||0)) { S = migrate(remote); ensureToday(); render(); }
      else if (S.updatedAt) { await ref.set(S); }
      this.unsub = ref.onSnapshot(sn => {
        if (!sn.exists || sn.metadata.hasPendingWrites) return;
        const d = sn.data();
        if ((d.updatedAt||0) > (S.updatedAt||0)) { S = migrate(d); ensureToday(); render(); }
      }, ()=>{});
    } catch(e) { console.warn('db unavailable', e); }
  },
  save(){
    syncHistory();
    S.updatedAt = Date.now();
    this.writeLocal();
    if (!this.db) return;
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(()=>{ this.db.doc('seekfirst/state').set(JSON.parse(JSON.stringify(S))).catch(e=>console.warn('save failed',e)); }, 400);
  },
  async loadJournal(date){
    if (this.db) { try { const s = await this.db.doc('journal/'+date).get(); return s.exists ? (s.data().text||'') : ''; } catch { return ''; } }
    try { return localStorage.getItem('seekfirst.journal.'+date) || ''; } catch { return ''; }
  },
  async saveJournal(date,text){
    try { localStorage.setItem('seekfirst.journal.'+date, text); } catch {}
    if (this.db) await this.db.doc('journal/'+date).set({date, text, updatedAt:Date.now()});
  },
  async listJournal(){
    if (this.db) { try { const q = await this.db.collection('journal').orderBy('date','desc').limit(90).get(); return q.docs.map(d=>d.data()).filter(d=>d.text&&d.text.trim()); } catch { return []; } }
    const out=[]; try { for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith('seekfirst.journal.')){ const t=localStorage.getItem(k); if(t&&t.trim()) out.push({date:k.slice(18),text:t}); } } } catch {}
    return out.sort((a,b)=>a.date<b.date?1:-1);
  }
};
function migrate(d){ const base = defaultState(); return Object.assign(base, d, {plan:{...base.plan,...d.plan}, prayer:{...base.prayer,...d.prayer}, memory:{...base.memory,...d.memory}, kids:{...base.kids,...d.kids}, settings:{...base.settings,...d.settings}, history:{...(d.history||{})}, today:{...base.today,...d.today}}); }
function syncHistory(){
  if (!S.today.date) return;
  const done = Object.keys(S.today.done).filter(k=>S.today.done[k]);
  if (done.length || S.today.prayed || S.today.reviewed) S.history[S.today.date] = {done, prayed:S.today.prayed||0, reviewed:S.today.reviewed||0};
  else delete S.history[S.today.date];
  const keys = Object.keys(S.history).sort();
  while (keys.length > 800) delete S.history[keys.shift()];
}

/* ---------- bible text ---------- */
/* The ASV ships with the page. The other three are copyrighted, so their text is
   never stored here — it is fetched a passage at a time from the publisher's own
   API and cached for the life of the page. ESV and NLT want a free key of the
   reader's own; NET asks for none. Anything that fails falls back to the ASV. */
/*#region translations*/
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TRANSLATIONS = {
  asv: {abbr:'ASV', name:'American Standard Version',
        credit:'American Standard Version (1901) · public domain'},
  net: {abbr:'NET', name:'New English Translation',
        credit:'NET Bible® copyright © 1996–2017 Biblical Studies Press, L.L.C. · netbible.com'},
  esv: {abbr:'ESV', name:'English Standard Version', key:'esv', keyUrl:'https://api.esv.org/',
        credit:'ESV® Bible, copyright © 2001 by Crossway. Used by permission. All rights reserved.'},
  nlt: {abbr:'NLT', name:'New Living Translation', key:'nlt', keyUrl:'https://api.nlt.to/',
        credit:'Holy Bible, New Living Translation, copyright © 1996, 2004, 2015 by Tyndale House Foundation. Used by permission.'},
};
const TRANSLATION_IDS = ['asv','net','esv','nlt'];
const translationId = id => TRANSLATIONS[id] ? id : 'asv';
const trAbbr = id => TRANSLATIONS[translationId(id)].abbr;
const apiKey = {
  get(t){ try { return localStorage.getItem('seekfirst.key.'+t) || '' } catch { return '' } },
  set(t,v){ try { v ? localStorage.setItem('seekfirst.key.'+t, v) : localStorage.removeItem('seekfirst.key.'+t) } catch {} },
};
function translationReady(id){ const t = TRANSLATIONS[translationId(id)]; return !t.key || !!apiKey.get(t.key); }
const readTranslation = () => translationId(S.settings.readTranslation);
const memoryTranslation = () => translationId(S.settings.memoryTranslation);

const bookCache = {};
async function loadBook(b){
  if (bookCache[b]) return bookCache[b];
  const r = await fetch(`bible/${b}.json`);
  if (!r.ok) throw new Error('no text');
  return (bookCache[b] = await r.json());
}
function findBook(name){
  const n = name.trim().toLowerCase().replace(/\s+/g,' ');
  return BOOKS.find(b => b.n.toLowerCase()===n || (b.n==='Psalms' && n==='psalm'));
}
// "Exodus 7:14-24; 10:21-29", "Genesis 7-8", "Luke 2:1-20", "John 3"
function parseRef(ref){
  const out=[]; let book=null;
  for (let part of ref.split(';')){
    part = part.trim();
    const m = part.match(/^((?:[1-3]\s)?[A-Za-z ]+?)\s+(\d.*)$/);
    let rest;
    if (m) { book = findBook(m[1]); rest = m[2]; } else rest = part;
    if (!book) return null;
    const cv = rest.match(/^(\d+)(?::(\d+)(?:-(\d+))?)?(?:-(\d+))?$/);
    if (!cv) return null;
    const c1=+cv[1];
    if (cv[2]) out.push({b:book.b,c:c1,v1:+cv[2],v2:cv[3]?+cv[3]:+cv[2]});
    else { const c2 = cv[4]?+cv[4]:c1; for(let c=c1;c<=c2;c++) out.push({b:book.b,c,v1:1,v2:999}); }
  }
  return out;
}

/* ---------- fetched translations ---------- */
const segCache = {};
const wholeChapter = s => s.v1===1 && s.v2>=999;
const segRef = s => `${bookName(s.b)} ${s.c}` + (wholeChapter(s) ? '' : `:${s.v1}-${s.v2}`);
function forgetTranslation(id){ for (const k of Object.keys(segCache)) if (k.startsWith(id+':')) delete segCache[k]; }

async function fetchNet(s){
  const r = await fetch(`https://labs.bible.org/api/?passage=${encodeURIComponent(segRef(s))}&type=json&formatting=plain`);
  if (!r.ok) throw new Error('NET '+r.status);
  const rows = await r.json();
  if (!Array.isArray(rows)) throw new Error('NET shape');
  return rows.map(v=>({n:+v.verse, t:String(v.text||'').replace(/\s+/g,' ').trim()})).filter(v=>v.t);
}
async function fetchEsv(s, key){
  const q = new URLSearchParams({q:segRef(s), 'include-headings':'false', 'include-footnotes':'false',
    'include-passage-references':'false', 'include-short-copyright':'false', 'include-verse-numbers':'true',
    'include-first-verse-numbers':'true', 'indent-poetry':'false', 'indent-paragraphs':'0'});
  const r = await fetch('https://api.esv.org/v3/passage/text/?'+q, {headers:{Authorization:'Token '+key}});
  if (!r.ok) throw new Error('ESV '+r.status);
  const d = await r.json();
  return splitNumbered((d.passages||[]).join(' '));
}
// "[1] In the beginning… [2] And the earth…" -> one entry a verse
function splitNumbered(txt){
  const parts = String(txt).split(/\[(\d+)\]/);
  const out=[];
  for (let i=1;i<parts.length;i+=2){
    const t = String(parts[i+1]||'').replace(/\s+/g,' ').trim();
    if (t) out.push({n:+parts[i], t});
  }
  return out;
}
async function fetchNlt(s, key){
  const ref = `${bookName(s.b).replace(/\s+/g,'')}.${s.c}` + (wholeChapter(s) ? '' : `.${s.v1}-${s.v2}`);
  const r = await fetch(`https://api.nlt.to/api/passages?version=NLT&ref=${encodeURIComponent(ref)}&key=${encodeURIComponent(key)}`);
  if (!r.ok) throw new Error('NLT '+r.status);
  // parsed into an inert document: scripts never run and only textContent is read back
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  doc.querySelectorAll('h1,h2,h3,h4,.tn,.a-tn,.cw,.cw_ch,.subhead').forEach(n=>n.remove());
  const out=[];
  for (const v of doc.querySelectorAll('verse_export')){
    const vn = v.querySelector('.vn');
    const n = parseInt(v.getAttribute('vn') || (vn ? vn.textContent : ''), 10);
    if (vn) vn.remove();
    const t = (v.textContent||'').replace(/\s+/g,' ').trim();
    if (t) out.push({n: n || out.length + s.v1, t});
  }
  return out;
}

async function asvVerses(s){
  const book = await loadBook(s.b);
  const verses = book[s.c-1] || [];
  return verses.slice(s.v1-1, Math.min(s.v2, verses.length)).map((t,i)=>({n:s.v1+i, t}));
}
// -> {tid, verses, why}: tid is what was actually found, which may be the ASV standing in
async function segmentVerses(s, want){
  want = translationId(want);
  if (want==='asv') return {tid:'asv', verses: await asvVerses(s)};
  const tr = TRANSLATIONS[want];
  const key = tr.key ? apiKey.get(tr.key) : '';
  if (tr.key && !key) return {tid:'asv', verses: await asvVerses(s), why:'key'};
  const ck = `${want}:${s.b}:${s.c}:${s.v1}:${s.v2}`;
  if (!segCache[ck]) {
    segCache[ck] = (want==='net' ? fetchNet(s) : want==='esv' ? fetchEsv(s, key) : fetchNlt(s, key))
      .then(vs => { if (!vs.length) throw new Error('empty'); return vs; })
      .catch(e => { delete segCache[ck]; throw e; });
  }
  try {
    let verses = await segCache[ck];
    if (!wholeChapter(s)) verses = verses.filter(v => v.n>=s.v1 && v.n<=s.v2);
    if (!verses.length) throw new Error('empty');
    return {tid:want, verses};
  } catch { return {tid:'asv', verses: await asvVerses(s), why:'away'}; }
}
async function renderPassage(el, segs, {chapterLabels=true, translation}={}){
  const want = translationId(translation || readTranslation());
  el.innerHTML = '<p class="tiny">Loading text…</p>';
  try {
    let html=''; const used=[]; let why='';
    for (const s of segs){
      const got = await segmentVerses(s, want);
      if (!used.includes(got.tid)) used.push(got.tid);
      if (got.why && !why) why = got.why;
      if (chapterLabels) html += `<div class="chap">${esc(bookName(s.b))} ${s.c}</div>`;
      html += '<p>' + got.verses.map(v=>`<sup>${v.n}</sup>${esc(v.t)}`).join(' ') + '</p>';
    }
    html += used.map(t=>`<p class="tiny">${esc(TRANSLATIONS[t].credit)}</p>`).join('');
    if (why==='key') html += `<p class="tiny">Showing the ASV — add a free ${esc(trAbbr(want))} key under <a href="#manage">Manage → Translations</a>.</p>`;
    else if (why==='away') html += `<p class="tiny">The ${esc(trAbbr(want))} could not be reached just now, so this is the ASV.</p>`;
    el.innerHTML = html;
  } catch { el.innerHTML = '<p class="tiny">Text not available here — read it in your own Bible.</p>'; }
}
// a passage as one run of prose, for a memory card
async function passageText(segs, want){
  let text='', tid=null;
  for (const s of segs){
    const got = await segmentVerses(s, want);
    if (tid && got.tid!==tid) return {text:'', tid:got.tid};
    tid = got.tid;
    text += (text ? ' ' : '') + got.verses.map(v=>v.t).join(' ');
  }
  return {text:text.trim(), tid};
}
/*#endregion*/

/* ---------- reading plan ---------- */
function todaysReading(){
  const plan = PLANS[S.plan.id];
  const segs=[];
  plan.tracks.forEach((t,i)=>{
    const n = plan.tracks.length===1 ? S.plan.perDay : 1;
    for (let k=0;k<n;k++){ const [b,c] = t.chapters[(S.plan.pos[i]+k) % t.chapters.length]; segs.push({b,c,v1:1,v2:999}); }
  });
  return segs;
}
function refLabel(segs){
  // group consecutive chapters of the same book: "Matthew 5–7"
  const parts=[]; 
  for (const s of segs){
    const last = parts[parts.length-1];
    if (last && last.b===s.b && s.v1===1 && s.v2===999 && last.c2===s.c-1) last.c2=s.c;
    else parts.push({b:s.b,c1:s.c,c2:s.c,v1:s.v1,v2:s.v2});
  }
  return parts.map(p => {
    if (p.v1===1 && p.v2===999) return `${bookName(p.b)} ${p.c1}${p.c2>p.c1?'–'+p.c2:''}`;
    return `${bookName(p.b)} ${p.c1}:${p.v1}${p.v2>p.v1?'–'+p.v2:''}`;
  }).join(' · ');
}
function advanceReading(){
  const plan = PLANS[S.plan.id];
  plan.tracks.forEach((t,i)=>{ const n = plan.tracks.length===1 ? S.plan.perDay : 1; S.plan.pos[i] = (S.plan.pos[i]+n) % t.chapters.length; });
}

/* ---------- prayer rotation ---------- */
function pickPrayers(){
  const active = S.prayer.items.filter(isActive);
  const daily = active.filter(p=>p.daily);
  const rest = active.filter(p=>!p.daily).sort((a,b)=> (a.lastPrayed||'') < (b.lastPrayed||'') ? -1 : (a.lastPrayed||'') > (b.lastPrayed||'') ? 1 : a.added < b.added ? -1 : 1);
  return [...daily, ...rest.slice(0, Math.max(0, S.prayer.perDay))].map(p=>p.id);
}
const isActive = p => !p.answered && !p.ended;
function ensurePrayerSelection(){
  const k = dayKey();
  for (const p of S.prayer.items) if (!p.answered && !p.ended && p.until && p.until < k) p.ended = k;
  const validIds = new Set(S.prayer.items.filter(isActive).map(p=>p.id));
  S.today.prayIds = (S.today.prayIds||[]).filter(id=>validIds.has(id));
  if (S.today.prayIds.length===0 && validIds.size) S.today.prayIds = pickPrayers();
}
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- memory (topical memory system) ---------- */
function ensureLearningCard(){
  if (S.memory.cards.some(c=>c.status==='learning')) return;
  while (S.memory.nextTms < TMS.length && S.memory.cards.some(c=>c.tms===S.memory.nextTms)) S.memory.nextTms++;
  if (S.memory.nextTms >= TMS.length) return;
  const v = TMS[S.memory.nextTms];
  const card = {id:uid(), tms:S.memory.nextTms, ref:v.ref, text:v.text, tr:'asv', topic:v.topic, series:v.series, status:'learning', reps:0, lastRep:'', interval:0, due:'', added:dayKey()};
  S.memory.cards.push(card);
  fitMemoryTranslation(card);
  S.memory.nextTms++;
}
/* A course card carries the wording the reader is working on. A card that has not
   been recited yet takes the memory default; once it has, it keeps the words it was
   learned in — nobody wants the verse to change under them mid-week. */
const trTried = new Set();
function fitMemoryTranslation(card){
  const want = memoryTranslation();
  if (!card || card.tms==null || (card.tr||'asv')===want) return;
  const mark = card.id+':'+want;
  if (trTried.has(mark)) return;
  trTried.add(mark);
  const segs = parseRef(card.ref);
  if (!segs) return;
  passageText(segs, want).then(got=>{
    const live = S.memory.cards.find(c=>c.id===card.id);
    if (!live || !got.text || got.tid!==want) return;
    live.text = got.text; live.tr = want;
    store.save(); render();
  }).catch(()=>{});
}
function dueReviews(){ const k=dayKey(); return S.memory.cards.filter(c=>c.status==='review' && c.due && c.due<=k).sort((a,b)=>a.due<b.due?-1:1); }
function promoteToReview(card, interval=1){ card.status='review'; card.interval=interval; card.due=addDays(dayKey(),interval); }
function gradeReview(card, ok){
  const k = dayKey();
  if (ok) { card.interval = Math.max(1, Math.round((card.interval||1) * 2.2)); card.due = addDays(k, Math.min(card.interval, 120)); card.reps=(card.reps||0)+1; }
  else { card.interval = 1; card.due = addDays(k,1); }
  card.lastRep = k; S.today.reviewed = (S.today.reviewed||0)+1;
}

/* ---------- rendering ---------- */
const app = document.getElementById('app');
const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k==='class') el.className=v; else if (k==='html') el.innerHTML=v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v===false||v==null) {} else el.setAttribute(k, v===true?'':v);
  }
  for (const c of kids.flat()) if (c!=null) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
};

function render(){
  ensureToday();
  document.getElementById('dateLabel').textContent = longDate();
  const route = location.hash.replace('#','') || 'today';
  document.getElementById('navToday').hidden = route==='today';
  document.getElementById('navManage').hidden = route==='manage';
  document.getElementById('navProgress').hidden = route==='progress';
  document.getElementById('navPrint').hidden = route==='print';
  app.replaceChildren(route==='manage' ? renderManage() : route==='progress' ? renderProgress() : route==='print' ? renderPrint() : renderToday());
}

function renderToday(){
  ensurePrayerSelection();
  ensureLearningCard();
  const doneCount = STEPS.filter(s=>S.today.done[s.id]).length;
  if (!stepChosen) { const first = STEPS.findIndex(s=>!S.today.done[s.id]); currentStep = first<0 ? STEPS.length : first; }
  const frag = document.createDocumentFragment();

  const strip = h('ol',{class:'steps'}, STEPS.map((s,i)=> h('li',{class:(S.today.done[s.id]?'done ':'')+(i===currentStep?'cur':'')},
    h('button',{onclick:()=>{ currentStep=i; stepChosen=true; render(); }, 'aria-label':s.label+(S.today.done[s.id]?', done':'')}, h('span',{class:'bar'}), h('span',{class:'lbl'}, s.label)))));
  frag.append(strip);

  if (currentStep >= STEPS.length || (doneCount===STEPS.length && !stepChosen)) { frag.append(renderFinish()); return frag; }
  const step = STEPS[currentStep].id;
  const body = {read:renderRead, pray:renderPray, memory:renderMemory, journal:renderJournal, kids:renderKids}[step]();
  frag.append(body);
  return frag;
}

function doneRow(stepId, {label='Done', onDone}={}){
  const isDone = !!S.today.done[stepId];
  const next = () => { const i = STEPS.findIndex((s,j)=> j>currentStep && !S.today.done[s.id]); currentStep = i<0 ? (STEPS.findIndex(s=>!S.today.done[s.id])<0 ? STEPS.length : STEPS.findIndex(s=>!S.today.done[s.id])) : i; stepChosen=true; };
  return h('div',{class:'done-row'},
    h('span',{class:'tiny'}, isDone ? 'Marked done for today.' : `Step ${currentStep+1} of ${STEPS.length}`),
    h('div',{class:'actions',style:'margin:0'},
      isDone ? h('button',{class:'btn quiet',onclick:()=>{ delete S.today.done[stepId]; store.save(); render(); }}, 'Undo') : null,
      h('button',{class:'btn primary',onclick:()=>{ if(!isDone){ S.today.done[stepId]=true; onDone&&onDone(); store.save(); } next(); render(); }}, isDone ? 'Next →' : label + ' →')
    ));
}

/* a translation picker: compact in a step, spelled out in Manage */
function translationSelect(current, onPick, {mini=false, id}={}){
  const attrs = {class: mini ? 'mini' : '', 'aria-label':'Translation'};
  if (id) attrs.id = id;
  const sel = h('select', attrs, TRANSLATION_IDS.map(t => h('option',{value:t, selected:t===current},
    mini ? TRANSLATIONS[t].abbr
         : `${TRANSLATIONS[t].abbr} \u2014 ${TRANSLATIONS[t].name}${translationReady(t) ? '' : ' \u00b7 needs a key'}`)));

/* Prayer chat: plain words in, structured requests out.

   Three engines answer a note, in this order of preference:
     rules  — the regex parser below. Instant, offline, always available.
     local  — a 23 MB sentence-embedding model (MiniLM) run in this browser by
              transformers.js. It only refines what the rules produced: the
              category, add-vs-answered, and which existing request a note is
              about. Downloads once, then lives in the browser's cache.
     claude — one sampling call, available only when this page is published as
              a claude.ai artifact.
   Manage → Prayer list picks between them; the rules are the floor under all
   three, so a failed download or a revoked grant never costs more than accuracy. */

/*#region prayer-parse — pure functions, no DOM and no app state; see prayer-parse.test.mjs */
const WEEKDAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const NUMWORDS = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,couple:2,few:3};
const RELATIONS = "wife|husband|spouse|fianc[eé]e?|son|daughter|kids?|child|children|mom|mum|mother|dad|father|parents?|brother|sister|sibling|grandma|grandpa|grandmother|grandfather|grandson|granddaughter|aunt|uncle|cousin|nephew|niece|in-laws?|family|friend|neighbou?r|coworker|co-worker|colleague|classmate|roommate|boss|pastor|teacher";
const SMALL_WORDS = new Set(['of','the','and','for','in','at','on','a','an','to','my','our','from']);

const FILLER_RE = /^(?:ok(?:ay)?|so|umm?|uh+|hey|hi|hello|well|and|also|plus|then|oh|yeah|just)\b[\s,]*/i;
const ASK_RE = /^(?:(?:could|can|would|will)\s+(?:you|we|u)\s+)?(?:please\s+)?(?:remember|lift\s+up|keep\s+praying|be\s+praying|start\s+praying|praying|prayers?|pray|add|put|include)\b\s*(?:for|about|over|on)?\s*[:,-]?\s*/i;
const TRAIL_RE = /(?:\s*,?\s*(?:please|thanks|thank\s+you|thx))?(?:\s+to\s+(?:the|my|our)\s+(?:prayer\s+)?list)?\s*[.!?,;:\s-]*$/i;
const REMOVE_RE = /\b(?:remove|delete|take\s+(?:\S+\s+){0,4}?off|drop|stop\s+praying|no\s+longer\s+(?:need|want|praying))\b/i;
const ANSWERED_PREFIX_RE = /^(?:answered|praise(?:\s+(?:god|the\s+lord|jesus))?|good\s+news|update)\b[\s:—–-]+/i;
const ANSWERED_RE = /\b(?:answer(?:ed|s)\b|praise\s+(?:god|the\s+lord)|went\s+(?:well|great|fine)|(?:is|are|'s|’s)\s+(?:better|healed|home|well|fine|through\s+it|out\s+of\s+(?:the\s+)?hospital|cancer[-\s]free|in\s+remission)|got\s+(?:the|a)\s+(?:job|offer|house|place|visa)|was\s+hired|healed\b|recovered\b|recovering\s+well|came\s+(?:home|through)|all\s+clear|clean\s+bill|arrived\s+safely|passed\s+(?:the|her|his|their)\s+\w+)/i;

/* "and Ana", "and my brother", "and his wife" start a new request; "and knee" does not. */
const SPLIT_RE = new RegExp(
  ',?\\s+(?:and\\s+also|and|also|plus)\\s+(?=' +
    '(?:please\\s+)?(?:pray|remember|lift)\\b' +
    '|for\\s+\\S' +
    '|(?:my|our)\\s+\\S' +
    '|(?:his|her|their)\\s+(?:' + RELATIONS + ')\\b' +
    '|the\\s+[A-Z]' +
    '|[A-Z][a-z’\'-]+' +
  ')', 'g');
/* Where a "who" ends and the need begins. Punctuation is dropped, verbs are kept. */
const SEP_RE = /\s*(?:—|–|--|:|;)\s*|\s+-\s+|\s*,\s*|\s+(?:about|regarding|concerning|who\s+is|who's|who’s|whose|who|that\s+is|because|since|as\s+(?:she|he|they)|with|struggling|dealing|going\s+through|starting|having|facing|awaiting|recovering|waiting|moving|travel?ling|fighting|battling|grieving|expecting|needs?|needing|has|have|had|is|are|was|were)\s+/i;

const words = s => String(s || '').toLowerCase().match(/[a-z0-9']+/g) || [];
const cutMatch = (s, m) => (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).replace(/\s{2,}/g, ' ').replace(/\s+([,.;:])/g, '$1').trim();
function properCase(s){
  const t = String(s || '').trim();
  if (/[A-Z]/.test(t)) return t;                    // the writer capitalised it themselves
  return t.split(/\s+/).map((w, i) => (i && SMALL_WORDS.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function nextWeekday(today, name){
  const want = WEEKDAYS.indexOf(name.toLowerCase());
  const [y, m, d] = today.split('-').map(Number);
  return addDays(today, (want - new Date(y, m - 1, d).getDay() + 7) % 7);
}

/* Time words → an end date, plus the "every day" flag. Both are cut from the text. */
function extractWhen(text, today){
  let s = text, until = '', daily = false;
  const d = s.match(/\b(?:every|each)\s+(?:day|morning|evening|night)\b|\bdaily\b/i);
  if (d) { daily = true; s = cutMatch(s, d); }
  const rules = [
    [/\bfor\s+(?:the\s+next\s+)?(\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|couple(?:\s+of)?|few)\s+(day|week|month)s?\b/i,
      g => addDays(today, (NUMWORDS[g[1].toLowerCase().replace(/\s+of$/, '')] || Number(g[1]) || 1) * (g[2][0] === 'd' ? 1 : g[2][0] === 'w' ? 7 : 30))],
    [/\b(?:until|till|til|thr(?:ough|u))\s+(?:the\s+end\s+of\s+)?(?:this\s+|next\s+|the\s+)?(week|month|year|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i,
      g => { const w = g[1].toLowerCase(); return w === 'week' ? addDays(today, 7) : w === 'month' ? addDays(today, 30) : w === 'year' ? addDays(today, 365) : nextWeekday(today, w); }],
    [/\bnext\s+(week|month)\b/i, g => addDays(today, g[1][0] === 'w' ? 14 : 60)],
    [/\bthis\s+(week|month)\b/i, g => addDays(today, g[1][0] === 'w' ? 7 : 30)],
    [/\b(today|tonight|tomorrow)\b/i, g => /tomorrow/i.test(g[1]) ? addDays(today, 1) : today],
  ];
  for (const [re, end] of rules) { const g = s.match(re); if (g) { until = end(g); s = cutMatch(s, g); break; } }
  /* "her surgery on Friday" dates the request but belongs in the words, so it is not cut. */
  if (!until) { const g = s.match(/\bon\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i); if (g) until = nextWeekday(today, g[1]); }
  return { text: s.replace(TRAIL_RE, '').trim(), until, daily };
}

/* "my neighbour Dave's chemo" → who Dave, what chemo, hint neighbour. */
function splitWhoWhat(raw){
  let s = String(raw || '').trim().replace(/^for\s+/i, '');
  let hint = '';
  const mine = s.match(/^(?:my|our)\s+/i);
  if (mine) { hint = 'mine'; s = s.slice(mine[0].length); }
  if (hint === 'mine' && /^own\b/i.test(s)) return { who: 'Me', what: ('my ' + s).replace(TRAIL_RE, '').trim(), hint: 'me' };
  if (/^(?:me|myself|i)\b/i.test(s)) {
    const rest = s.replace(/^(?:me|myself|i)\b[\s,:—–-]*/i, '').replace(/^(?:about|with|and|for)\s+/i, '');
    return { who: 'Me', what: rest.replace(TRAIL_RE, '').trim(), hint: 'me' };
  }
  let who = '', what = '';
  /* a relation followed by a name: the name is the person, the relation is a category hint */
  const first = (s.split(/\s+/)[0] || '').replace(/[^\w'’-]/g, '');
  if (new RegExp('^(?:' + RELATIONS + ')$', 'i').test(first)) {
    hint = hint === 'mine' || !hint ? first.toLowerCase() : hint;
    const after = s.slice(first.length).replace(/^[\s,]+/, '');
    const named = after.match(/^([A-Z][\w'’-]*(?:\s+[A-Z][\w'’-]*)?)/);
    if (named) {
      who = named[1].replace(/['’]s$/, '');
      what = after.slice(named[1].length).replace(/^['’]s\s*/, '').replace(/^[\s,]+/, '');
    }
  }
  if (!who) {
    const poss = s.match(/^(.{1,40}?)['’]s\s+(.+)$/);
    if (poss && words(poss[1]).length <= 3) { who = poss[1]; what = poss[2]; }
  }
  if (!who) {
    const g = s.match(SEP_RE);
    if (g && g.index > 0 && words(s.slice(0, g.index)).length <= 5) {
      who = s.slice(0, g.index).trim();
      what = s.slice(g.index).replace(/^\s*(?:—|–|--|:|;|,)\s*/, '').replace(/^\s+-\s+/, '').trim();
    }
  }
  if (!who) {
    const w = s.replace(/^the\s+/i, '').split(/\s+/);
    const named = w.length > 1 && /^[A-Z]/.test(w[0]) && /^[A-Z]/.test(w[1]);
    if (named) { who = w.slice(0, 2).join(' '); what = w.slice(2).join(' '); }
    else if (/^[A-Z]/.test(w[0]) && w.length > 3) { who = w[0]; what = w.slice(1).join(' '); }
    else if (w.length <= 6) { who = w.join(' '); what = ''; }          // "the persecuted church in Nigeria"
    else { who = w.slice(0, 3).join(' '); what = w.join(' '); }
  }
  who = properCase(who.replace(/^(?:my|our|the)\s+/i, '').replace(TRAIL_RE, '').trim());
  who = who.charAt(0).toUpperCase() + who.slice(1);
  what = what.replace(/^(?:about|regarding|concerning)\s+/i, '').replace(TRAIL_RE, '').trim();
  return { who, what, hint };
}

/* sure:false means "no keyword said so, this is just the default" — the on-device
   model is allowed to overrule those and only those. */
function ruleCategory(who, what, hint){
  const b = (hint + ' ' + who + ' ' + what).toLowerCase();
  if (hint === 'me' || /^(?:me|myself)$/i.test(who)) return { cat: 'Me', sure: true };
  if (/\b(?:wife|husband|spouse|fianc|son|daughter|kids?|child|children|mom|mum|mother|dad|father|parents?|brother|sister|sibling|grand(?:ma|pa|mother|father|son|daughter)|aunt|uncle|cousin|nephew|niece|in-laws?|family)\b/.test(b)) return { cat: 'Family', sure: true };
  if (/\b(?:missionar\w+|nations?|country|world|persecuted|war|famine|earthquake|flood|refugees?|israel|ukraine|gaza|china|india|africa|sudan|government|president|election|leaders)\b/.test(b)) return { cat: 'World', sure: true };
  if (/\b(?:church|pastor|elders?|deacons?|small\s+group|congregation|sunday\s+school|youth\s+group|worship\s+team|bible\s+study|ministry)\b/.test(b)) return { cat: 'Church', sure: true };
  if (/\b(?:friend|neighbou?r|coworker|co-worker|colleague|classmate|roommate|boss|teammate)\b/.test(b)) return { cat: 'Friends', sure: true };
  if (hint === 'mine' && /\b(?:own|heart|faith|walk|temptation|patience|attitude|anger|anxiety|worry|habit|tongue|pride)\b/.test(b)) return { cat: 'Me', sure: false };
  return { cat: 'Friends', sure: false };
}

function splitClauses(text){
  const out = [];
  for (const chunk of String(text || '').split(/[\n;]+|(?<!\b(?:Dr|Mr|Mrs|Ms|St|Sr|Jr|Prof|Rev|Fr|vs|etc))[.!?]+\s+(?=[A-Z])/)) {
    const s = chunk.trim();
    if (!s) continue;
    let last = 0, m;
    SPLIT_RE.lastIndex = 0;
    while ((m = SPLIT_RE.exec(s))) { out.push(s.slice(last, m.index)); last = m.index + m[0].length; }
    out.push(s.slice(last));
  }
  return out.map(s => s.trim()).filter(Boolean);
}

/* Which existing request is this note about? Names count for more than needs, and
   the words everybody uses count for nothing — "the request about his back" must
   not land on "The Ortiz family" because both say "the". */
const MATCH_STOP = new Set(['the','and','for','her','his','its','our','their','them','they','that','this','with','about','from','just','been','have','has','had','was','were','will','would','pray','prayer','prayers','praying','request','requests','list','off','take','please','thing','one','some','any','all','now','still','again','over']);
const keyWords = (s, min) => words(s).filter(w => w.length > (min || 2) && !MATCH_STOP.has(w));
function matchItem(text, items, used){
  const toks = new Set(keyWords(text, 2));
  const low = String(text || '').toLowerCase();
  let best = null, top = 0;
  for (const p of items || []) {
    if (used && used.has(p.id)) continue;
    let score = 0;
    if (p.who && low.includes(p.who.toLowerCase())) score += 3;
    else if (keyWords(p.who, 2).some(w => toks.has(w))) score += 2;
    const overlap = keyWords(p.what, 3).filter(w => toks.has(w)).length;
    if (overlap) score += Math.min(2, overlap * 2);
    if (score > top) { top = score; best = p; }
  }
  return top >= 2 ? best : null;
}

function parseAdd(clause, ctx){
  let t = clause;
  const ask = t.match(ASK_RE);
  if (ask) t = t.slice(ask[0].length);
  t = t.replace(TRAIL_RE, '').trim();
  if (!t) return { type: 'miss', reason: 'empty', text: clause };
  const when = extractWhen(t, ctx.today);
  const ww = splitWhoWhat(when.text);
  let who = ww.who;
  /* "…and his wife" carries the last person forward */
  const follow = who.match(new RegExp('^(?:his|her|their)\\s+(' + RELATIONS + ')$', 'i'));
  if (follow) {
    if (!ctx.lastWho) return { type: 'miss', reason: 'empty', text: clause };
    who = ctx.lastWho + '’s ' + follow[1].toLowerCase();
  }
  if (!who || !/[a-z0-9]/i.test(who)) return { type: 'miss', reason: 'empty', text: clause };
  const c = ruleCategory(who, ww.what, ww.hint);
  return { type: 'add', who, what: ww.what, cat: c.cat, catSure: c.sure, daily: when.daily, until: when.until, src: clause };
}

function parseClause(clause, ctx){
  let s = clause.replace(/^[\s,.-]+/, '');
  for (let i = 0; i < 3; i++) { const m = s.match(FILLER_RE); if (!m) break; s = s.slice(m[0].length); }
  if (!s.trim()) return null;
  const prefix = s.match(ANSWERED_PREFIX_RE);
  const body = prefix ? s.slice(prefix[0].length) : s;
  if (REMOVE_RE.test(s)) {
    const p = matchItem(body, ctx.items, ctx.used);
    return p ? { type: 'remove', id: p.id, who: p.who } : { type: 'miss', reason: 'remove', text: body.replace(TRAIL_RE, '') };
  }
  if (prefix || ANSWERED_RE.test(s)) {
    const p = matchItem(body, ctx.items, ctx.used);
    if (p) return { type: 'answered', id: p.id, who: p.who };
    if (prefix) return { type: 'miss', reason: 'answered', text: body.replace(TRAIL_RE, '') };
    /* only a soft signal and nobody it could mean — read it as a fresh request */
  }
  return parseAdd(s, ctx);
}

/* The whole rule engine: a note in, {actions, misses} out. Never throws. */
function parseNote(text, ctx){
  const c = ctx || {};
  const inner = { today: c.today || '1970-01-01', items: c.items || [], lastWho: c.lastWho || '', used: new Set() };
  const actions = [], misses = [];
  for (const clause of splitClauses(text)) {
    const a = parseClause(clause, inner);
    if (!a) continue;
    if (a.type === 'miss') { misses.push(a); continue; }
    actions.push(a);
    if (a.id) inner.used.add(a.id);
    if (a.type === 'add' && a.who) inner.lastWho = a.who;
  }
  return { actions, misses, lastWho: inner.lastWho, engine: 'rules' };
}
/*#endregion*/

/*#region brain — MiniLM sentence embeddings, run on this device by transformers.js.
   It never extracts text; it only judges meaning where the keywords above had to
   guess: the category, whether a note reports an answer, and which request it is
   about. One 384-dim vector per short string, a few milliseconds each. */
const BRAIN_SRC = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0/dist/transformers.min.js';
const BRAIN_MODEL = 'Xenova/all-MiniLM-L6-v2';
const BRAIN_SIZE = '45 MB';   // measured first load: 22 MB model, 22 MB ONNX runtime, ~1 MB tokenizer and loader
const PROTOS = {
  intent: {
    /* No names here: a prototype containing "Michael" pulls in every note that
       mentions Michael, whatever the note actually says. */
    add: ['please pray for a friend who is sick', 'add someone to the prayer list',
          'pray for a neighbour about an exam next week', 'keep praying for a brother and his job search',
          'please keep praying about this same need', 'pray again about the thing we raised before'],
    answered: ['God answered our prayer about this', 'her surgery went well and she is recovering',
               'he got the job we had been praying about', 'she is out of hospital and doing fine',
               'praise God, the test results came back clear', 'they arrived safely and are settling in',
               'the move went through and they are in the new house', 'he is back at work and free of pain'],
    remove: ['take that person off the prayer list', 'please remove that request from the list',
             'delete the request about the car', 'we can stop praying for that one now'],
  },
  cat: {
    Family: ['my wife', 'my husband and our children', 'my mother and her health',
             'my brother and his family', 'our son struggling at school', 'my parents'],
    Friends: ['my friend from work', 'my neighbour who is unwell', 'a coworker going through a hard time',
              'someone I know from school', 'a family we are close to'],
    Church: ['our pastor and the elders', 'our small group at church', 'the youth ministry in our congregation',
             'Sunday worship and the sermon', 'our church building fund'],
    World: ['missionaries serving overseas', 'the persecuted church in other nations',
            'the war and the people suffering in it', 'our country and its leaders',
            'families caught in the earthquake', 'unreached people groups',
            'believers in another country', 'Christians facing pressure abroad'],
    Me: ['my own heart and my walk with God', 'I am anxious and need peace',
         'my own temptation and sin', 'help me with my temper', 'my faith feels dry'],
  },
};
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

const brain = {
  state: 'idle',            // idle · loading · ready · failed
  detail: '', ms: 0, pipe: null, protos: null, loading: null, cached: true,
  files: new Map(), tick: 0, vecs: new Map(),
  ready(){ return this.state === 'ready'; },

  load(){
    if (this.loading) return this.loading;
    if (this.state === 'ready') return Promise.resolve();
    this.state = 'loading'; this.detail = 'starting'; this.files.clear(); onBrainChange();
    const t0 = Date.now();
    this.loading = (async () => {
      const tf = await import(BRAIN_SRC);
      tf.env.allowLocalModels = false;
      const build = cache => {
        tf.env.useBrowserCache = cache;              // cached, the download survives a reload
        return tf.pipeline('feature-extraction', BRAIN_MODEL,
          { dtype: 'q8', device: 'wasm', progress_callback: p => this.onProgress(p) });
      };
      // A private window or an embedded webview may have no Cache API at all, and
      // transformers.js treats that as fatal rather than simply fetching. Working
      // without the cache is much better than not working.
      try { this.pipe = await build(true); }
      catch (e) {
        if (!/cache/i.test(String((e && e.message) || e))) throw e;
        console.warn('no browser cache available — loading the model without it', e);
        this.cached = false;
        this.pipe = await build(false);
      }
      const keys = [], lines = [];
      for (const kind of Object.keys(PROTOS))
        for (const label of Object.keys(PROTOS[kind]))
          for (const line of PROTOS[kind][label]) { keys.push([kind, label]); lines.push(line); }
      const v = await this.embed(lines);
      this.protos = { intent: [], cat: [] };
      keys.forEach(([kind, label], i) => this.protos[kind].push({ label, vec: v[i] }));
      this.ms = Date.now() - t0;
      this.state = 'ready'; this.detail = '';
    })().catch(e => {
      this.state = 'failed';
      this.detail = String((e && e.message) || e).slice(0, 90);
      console.warn('on-device model failed to load', e);
    }).finally(() => { this.loading = null; onBrainChange(); });
    return this.loading;
  },

  onProgress(p){
    if (!p || !p.file) return;
    if (p.status === 'progress' && p.total) this.files.set(p.file, { loaded: p.loaded || 0, total: p.total });
    else if (p.status === 'initiate' && !this.files.has(p.file)) this.files.set(p.file, { loaded: 0, total: 0 });
    else if (p.status === 'done' && this.files.has(p.file)) { const f = this.files.get(p.file); f.loaded = f.total; }
    const now = Date.now();
    if (p.status === 'progress' && now - this.tick < 300) return;
    this.tick = now;
    let l = 0, t = 0;
    for (const f of this.files.values()) { l += f.loaded; t += f.total; }
    this.detail = t ? `${Math.round(Math.min(l, t) / 1048576)} of ${Math.round(t / 1048576)} MB` : 'starting';
    onBrainChange();
  },

  async embed(texts){
    const out = await this.pipe(texts, { pooling: 'mean', normalize: true });
    const [n, d] = out.dims;
    return Array.from({ length: n }, (_, i) => out.data.subarray(i * d, (i + 1) * d));
  },

  pick(vec, protos){
    const best = new Map();
    for (const p of protos) { const s = dot(vec, p.vec); if (s > (best.has(p.label) ? best.get(p.label) : -1)) best.set(p.label, s); }
    const ranked = [...best].sort((a, b) => b[1] - a[1]);
    return { label: ranked[0][0], score: ranked[0][1], margin: ranked[0][1] - (ranked[1] ? ranked[1][1] : 0) };
  },

  async itemVecs(items){
    const want = items.filter(p => !this.vecs.has(p.id + '|' + p.who + '|' + p.what));
    if (want.length) {
      const v = await this.embed(want.map(p => `${p.who} — ${p.what || 'a prayer request'}`));
      want.forEach((p, i) => this.vecs.set(p.id + '|' + p.who + '|' + p.what, v[i]));
    }
    return items.map(p => this.vecs.get(p.id + '|' + p.who + '|' + p.what));
  },

  async nearest(text, vec, items, floor){
    if (!items || !items.length) return null;
    const q = vec || (await this.embed([text]))[0];
    const iv = await this.itemVecs(items);
    let best = null, top = floor;
    items.forEach((p, i) => { const s = dot(q, iv[i]); if (s > top) { top = s; best = p; } });
    return best;
  },

  /* Take what the rules produced and sharpen only the parts they were unsure of. */
  async refine(base, text, ctx){
    if (!this.ready()) return base;
    try {
      const adds = base.actions.filter(a => a.type === 'add');
      const probe = [text, ...adds.map(a => a.src || (a.who + ' ' + (a.what || '')).trim())];
      const v = await this.embed(probe);
      const intent = this.pick(v[0], this.protos.intent);

      // A note the keywords read as a new request but that really closes an old one.
      // The margin between the winning intent and the runner-up is what separates the
      // two cases — on a spread of hand-checked notes every genuine close-out cleared
      // 0.06 and every "pray for them again" stayed under 0.02, while the raw score
      // overlapped badly. Resembling an existing request is the second gate, so a note
      // about someone new stays an add however it is phrased.
      if (adds.length && adds.length === base.actions.length && intent.label !== 'add' &&
          intent.score > 0.30 && intent.margin > 0.05) {
        const hit = await this.nearest(text, v[0], ctx.items, 0.45);
        if (hit) {
          const asked = /\b(?:stop|no longer|don'?t need|do not need|off the list|remove|delete|drop|not needed|never mind)\b/i.test(text);
          return { actions: [{ type: asked ? 'remove' : 'answered', id: hit.id, who: hit.who }],
                   misses: [], lastWho: base.lastWho, engine: 'local' };
        }
      }
      // Categories the keyword list had to fall back on. Me is left out of the vote:
      // it means the writer wrote about themselves, which is a fact about the words
      // ("I", "my own"), not a matter of meaning — the rules already settle it, and a
      // model guessing it puts other people's needs on the writer's own line.
      // The bar is high on purpose. Measured over a spread of notes, this model only
      // earns its vote when the note actually describes someone — "the believers in
      // Nigeria" clears it, a bare "Dave" or "Michael about his back" does not, and
      // below the bar its guesses were no better than the Friends default.
      const catProtos = this.protos.cat.filter(p => p.label !== 'Me');
      adds.forEach((a, i) => {
        if (a.catSure) return;
        const c = this.pick(v[i + 1], catProtos);
        if (c.score > 0.40 && c.margin > 0.10) a.cat = c.label;
      });
      // "that one is answered" — a close-out whose person the rules could not place.
      for (const m of base.misses) {
        if (m.reason !== 'answered' && m.reason !== 'remove') continue;
        const hit = await this.nearest(m.text, null, ctx.items, 0.40);
        if (hit) { base.actions.push({ type: m.reason === 'remove' ? 'remove' : 'answered', id: hit.id, who: hit.who }); m.done = true; }
      }
      base.misses = base.misses.filter(m => !m.done);
      base.engine = 'local';
      return base;
    } catch (e) { console.warn('on-device refine failed', e); return base; }
  },

  async forget(){
    try { if (window.caches) for (const k of await caches.keys()) if (/transformers/i.test(k)) await caches.delete(k); }
    catch (e) { console.warn('could not clear the model cache', e); }
    this.pipe = null; this.protos = null; this.vecs.clear(); this.files.clear();
    this.loading = null; this.ms = 0; this.state = 'idle'; this.detail = '';
    onBrainChange();
  },
};
/*#endregion*/

/* ---------- which engine answers a note ---------- */
const inArtifact = () => !!(window.claude && window.claude.use);
function resolveEngine(){
  const mode = (S.settings && S.settings.parser) || 'auto';
  if (mode === 'rules') return 'rules';
  if (mode === 'local') return 'local';
  if (mode === 'claude') return store.sample ? 'claude' : 'rules';
  return (store.sample || inArtifact()) ? 'claude' : 'local';       // auto
}
/* Metered connections are not the place to spend 45 MB nobody asked for, so
   "Best available" holds off on a phone data plan or with Data Saver on. Picking
   the on-device model by hand is asking, and always downloads. */
function meteredConnection(){
  const c = navigator.connection;
  return !!c && (c.saveData === true || /^(?:slow-2g|2g|3g)$/.test(c.effectiveType || '') ||
                 (c.type === 'cellular' && (S.settings.parser || 'auto') === 'auto'));
}
function autoHeldBack(){ return (S.settings.parser || 'auto') === 'auto' && meteredConnection(); }
function warmBrain(){
  if (resolveEngine() !== 'local' || brain.state !== 'idle' || autoHeldBack()) return;
  const go = () => brain.load();
  if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 2500 }); else setTimeout(go, 500);
}
function brainStatusText(brief){
  const e = resolveEngine();
  if (e === 'claude') return brief ? '' : 'Claude is reading your notes — this page is published as an artifact.';
  if (e === 'rules') return brief ? '' : 'Simple rules only — instant, nothing downloaded.';
  switch (brain.state) {
    case 'ready':   return brief ? '' : `Running on this device · model ready in ${(brain.ms / 1000).toFixed(1)}s${brain.cached ? '' : ', without a browser cache (it will download again next time)'}.`;
    case 'loading': return `Warming up the on-device model… ${brain.detail}. Rules are reading your notes until it lands.`;
    case 'failed':  return `The on-device model could not load (${brain.detail}) — reading your notes with simple rules.`;
    default:        return autoHeldBack()
      ? `Holding off on the ${BRAIN_SIZE} download on this connection — simple rules are reading your notes. Choose “On-device model” to fetch it anyway.`
      : (brief ? '' : `Not loaded yet · about ${BRAIN_SIZE}, downloaded once and then cached.`);
  }
}
function onBrainChange(){
  for (const el of document.querySelectorAll('[data-brain-status]')) el.textContent = brainStatusText(el.dataset.brainStatus === 'brief');
}

/* Prayer chat */
const chatLog = [];                                  // session-only transcript
const chatState = { lastWho: '', awaiting: '' };
function chatCtx(){ return { today: dayKey(), items: S.prayer.items.filter(isActive), lastWho: chatState.lastWho }; }

function addRequest(o){
  const item = {id:uid(), who:(o.who||'').trim(), what:(o.what||'').trim(), cat:PRAY_CATS.includes(o.cat)?o.cat:'Friends', daily:!!o.daily, until:/^\d{4}-\d{2}-\d{2}$/.test(o.until||'')?o.until:'', added:dayKey(), lastPrayed:'', count:0, answered:'', ended:''};
  if (!item.who) return null;
  S.prayer.items.push(item);
  if (item.daily || S.today.prayIds.length < S.prayer.perDay) S.today.prayIds.push(item.id);
  return item;
}

function chatInstruction(){
  const list = S.prayer.items.filter(isActive).map(p=>`${p.id} · ${p.who}${p.what?' · '+p.what:''}`).join('\n') || '(empty)';
  return `You turn a person's plain-language note into prayer-list actions for a personal devotions app. Today is ${dayKey()}.
Existing active requests (id · who · what):
${list}

Reply with ONLY this JSON, no prose: {"actions":[...],"reply":"one short warm sentence, no more than 12 words"}
Action shapes:
{"type":"add","who":"person or group","what":"the need in the writer's words, short; empty if none","cat":"Family|Friends|Church|World|Me","daily":false,"until":"YYYY-MM-DD or empty"}
{"type":"answered","id":"id of an existing request"}
{"type":"remove","id":"id of an existing request"}
Rules: one add per distinct person or need. Time words set until: "today" = today, "this week" = 7 days from today, "this month" = 30 days, "for N days/weeks" accordingly, otherwise empty. "every day"/"daily" sets daily true. cat: spouse, children, parents, siblings → Family; pastor, church, small group → Church; nations, missionaries, leaders, disasters → World; the writer's own need (I, me, my) → Me; anyone else → Friends. If the note says an existing request was answered, resolved, healed, or is no longer needed, use answered (or remove if they say to remove or delete it) with the matching id — do not add a duplicate.`;
}
async function claudeParse(text){
  try {
    const r = await store.sample.json(chatInstruction() + '\n\nNote (between the markers): <<<' + text.replace(/>>>/g, '') + '>>>', { modelTier: 'quick', cache: false });
    if (!r || !Array.isArray(r.actions)) return null;
    return { actions: r.actions, misses: [], reply: typeof r.reply === 'string' ? r.reply : '', lastWho: chatState.lastWho, engine: 'claude' };
  } catch (e) {
    if (e && e.code === 'not_granted') store.sample = null; else console.warn('sampling failed', e);
    return null;
  }
}
async function classify(text){
  const engine = resolveEngine();
  const ctx = chatCtx();
  if (engine === 'claude' && store.sample) { const r = await claudeParse(text); if (r) return r; }
  const base = parseNote(text, ctx);                 // instant, and the floor under everything
  if (engine === 'local') {
    if (brain.ready()) return await brain.refine(base, text, ctx);
    warmBrain();                                     // answer from the rules now, be sharper next time
  }
  return base;
}

function composeReply(added, closed, misses){
  const bits = [];
  const answered = closed.filter(c => c.type === 'answered').length;
  if (answered) bits.push(answered === 1 ? 'Thank God.' : 'Thank God for every one of those.');
  for (const m of misses) {
    if (m.reason === 'empty') { if (!added.length && !closed.length) bits.push('Who should I put on the list?'); }
    else bits.push(`I couldn’t find “${m.text}” on the list.`);
  }
  if (!added.length && !closed.length && !bits.length)
    return 'Who should I pray for? A name and a need is plenty — “Ana, her surgery on Friday”.';
  return bits.join(' ');
}

async function handleChat(text, log, input){
  let note = text;
  if (chatState.awaiting === 'who' && text.split(/\s+/).length <= 6 && !/\b(pray|about|for)\b/i.test(text)) note = 'pray for ' + text;
  chatState.awaiting = '';
  const my = h('div',{class:'msg me'}, text); log.append(my);
  const thinking = h('div',{class:'msg bot thinking'}, 'One moment…'); log.append(thinking); thinking.scrollIntoView({block:'nearest'});

  let r;
  try { r = await classify(note); } catch (e) { console.warn('classify failed', e); }
  if (!r || !Array.isArray(r.actions)) r = parseNote(note, chatCtx());

  const bot = h('div',{class:'msg bot'});
  const added = [], closed = [];
  for (const a of r.actions){
    if (a.type === 'add') {
      const it = addRequest(a); if (!it) continue;
      added.push(it);
      const line = h('span',{class:'act'}, 'Added ', h('span',{class:'k'}, it.who), it.what?` — ${it.what}`:'', ` · ${it.cat}${it.daily?' · daily':''}${it.until?' · through '+shortDate(it.until):''}`,
        h('button',{onclick:()=>{ S.prayer.items=S.prayer.items.filter(x=>x.id!==it.id); S.today.prayIds=S.today.prayIds.filter(x=>x!==it.id); store.save(); line.replaceChildren('Removed ', h('span',{class:'k'},it.who)); rerenderPrayList(); }},'undo'));
      bot.append(line);
    } else if (a.type === 'answered' || a.type === 'remove') {
      const p = S.prayer.items.find(x=>x.id===a.id); if (!p) continue;
      closed.push({p, type:a.type});
      const prev = {answered:p.answered, ended:p.ended};
      if (a.type==='answered') p.answered = dayKey(); else p.ended = dayKey();
      const line = h('span',{class:'act'}, a.type==='answered'?'Marked answered: ':'Removed: ', h('span',{class:'k'}, p.who),
        h('button',{onclick:()=>{ Object.assign(p, prev); store.save(); line.replaceChildren('Restored ', h('span',{class:'k'},p.who)); rerenderPrayList(); }},'undo'));
      bot.append(line);
    }
  }
  const n = added.length + closed.length;
  chatState.lastWho = added.length ? added[added.length-1].who : (r.lastWho || chatState.lastWho);
  if (!n) chatState.awaiting = 'who';
  const reply = (typeof r.reply === 'string' && r.reply) ? r.reply : composeReply(added, closed, r.misses || []);
  if (!n) bot.append(reply || 'Who should I pray for?');
  else if (reply) bot.append(h('span',{class:'act',style:'color:var(--ink-3)'}, reply));
  thinking.replaceWith(bot);
  chatLog.push(my, bot);
  if (n) { store.save(); rerenderPrayList(); }
  input.focus();
}

function rerenderPrayList(){ const keep = document.querySelector('.chat .row input'); const v = keep ? keep.value : ''; render(); const inp = document.querySelector('.chat .row input'); if (inp) { inp.value = v; inp.focus(); } }

function prayerChat(){
  const log = h('div',{class:'log'}, chatLog.slice(-8));
  const input = h('input',{id:'chat-in',placeholder:'e.g. pray for Michael about his back this week',autocomplete:'off','aria-label':'Describe a prayer request'});
  const send = () => { const t = input.value.trim(); if(!t) return; input.value=''; handleChat(t, log, input); };
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
  warmBrain();
  return h('div',{class:'chat'},
    log,
    h('div',{class:'row'}, input, h('button',{class:'btn primary',onclick:send},'Add')),
    h('p',{class:'hint'}, 'Write it however it comes to mind — a name, a need, how long. Several in one line is fine, and “Sarah’s surgery went well” marks hers answered.'),
    h('p',{class:'hint','data-brain-status':'brief'}, brainStatusText(true)));
}

/* Memorize */
function renderMemory(){
  const sec = h('section',{class:'step'}, h('p',{class:'eyebrow'},'Memorize · Topical Memory System'));
  const learning = S.memory.cards.find(c=>c.status==='learning');
  const due = dueReviews();
  const k = dayKey();
  sec.append(h('h1',{}, learning ? 'New verse' : 'Nothing new to learn'));
  if (learning){
    if (!learning.reps) fitMemoryTranslation(learning);
    const recitedToday = learning.lastRep===k;
    const text = h('p',{class:'verse-block'}, learning.text);
    let hidden=false;
    const hideBtn = h('button',{class:'btn sm',onclick:()=>{ hidden=!hidden; text.classList.toggle('hidden',hidden); hideBtn.textContent = hidden?'Show text':'Hide text & recite'; }}, 'Hide text & recite');
    sec.append(h('div',{class:'card'},
      h('p',{class:'eyebrow'}, `${learning.series} · ${learning.topic}`),
      h('p',{class:'ref'}, learning.ref, trTag(learning)), text,
      h('div',{class:'actions'}, hideBtn,
        h('button',{class:'btn sm'+(recitedToday?' quiet':''),onclick:()=>{ if(!recitedToday){ learning.reps=(learning.reps||0)+1; learning.lastRep=k; store.save(); render(); } }}, recitedToday ? `Recited today ✓ (${learning.reps} days)` : `I recited it (${learning.reps||0} days so far)`),
        h('button',{class:'btn sm quiet',onclick:()=>{ promoteToReview(learning, 2); store.save(); render(); }}, 'I know it — move to review')),
      h('p',{class:'tiny',style:'margin:12px 0 0'}, 'Say it aloud with the reference before and after. When you can say it three days running without looking, move it to review; the next verse starts then.')));
  } else if (S.memory.nextTms >= TMS.length) {
    sec.append(h('p',{class:'empty'}, 'You have started all 60 verses. Add your own under Manage, or keep reviewing.'));
  }

  sec.append(h('h2',{style:'margin-top:26px'}, due.length ? `Review · ${due.length} due` : 'Review'));
  if (!due.length) {
    const rev = S.memory.cards.filter(c=>c.status==='review');
    const nextDue = rev.map(c=>c.due).filter(Boolean).sort()[0];
    sec.append(h('p',{class:'muted'}, rev.length ? `Nothing due today. ${rev.length} in review; next one ${nextDue===addDays(k,1)?'tomorrow':'on '+nextDue}.` : 'Verses you already know go here — mark them under Manage → Memory verses and they will come back on a spaced schedule.'));
  } else {
    const list = h('div',{class:'review-list'});
    for (const c of due.slice(0,4)) {
      const text = h('p',{class:'verse-block hidden'}, c.text);
      let shown=false;
      const reveal = h('button',{class:'btn sm',onclick:()=>{ shown=true; text.classList.remove('hidden'); reveal.hidden=true; grades.hidden=false; }}, 'Reveal');
      const grades = h('div',{class:'actions',hidden:true,style:'margin-top:10px'},
        h('button',{class:'btn sm primary',onclick:()=>{ gradeReview(c,true); store.save(); render(); }}, 'Remembered'),
        h('button',{class:'btn sm',onclick:()=>{ gradeReview(c,false); store.save(); render(); }}, 'Forgot — see it tomorrow'));
      list.append(h('div',{class:'card'}, h('p',{class:'eyebrow'}, c.topic||'Custom'), h('p',{class:'ref'}, c.ref, trTag(c)), text, h('div',{class:'actions'}, reveal), grades));
    }
    if (due.length>4) list.append(h('p',{class:'tiny'}, `${due.length-4} more waiting — they’ll show once these are done.`));
    sec.append(list);
  }
  for (const t of shownTranslations([learning, ...due.slice(0,4)])) sec.append(h('p',{class:'tiny'}, TRANSLATIONS[t].credit));
  sec.append(doneRow('memory',{label:'Done'}));
  return sec;
}
const trTag = card => card && card.tr && card.tr!=='asv' ? h('span',{class:'tr-tag'}, TRANSLATIONS[card.tr].abbr) : null;
const shownTranslations = cards => [...new Set(cards.filter(Boolean).map(c=>c.tr).filter(t=>t && t!=='asv' && TRANSLATIONS[t]))];

/* Journal */
function renderJournal(){
  const k = dayKey();
  const dayNum = Math.floor(new Date(k).getTime()/864e5);
  const prompt = PROMPTS[(dayNum + (S.today.promptShift||0) + PROMPTS.length*100) % PROMPTS.length];
  const sec = h('section',{class:'step'}, h('p',{class:'eyebrow'}, 'Journal · ' + refLabel(todaysReading())), h('h1',{}, prompt));
  const ta = h('textarea',{id:'journal-'+k,placeholder:'Write a few honest lines…','aria-label':'Journal entry'});
  const state = h('span',{class:'save-state'},'');
  let timer=null, loaded=false;
  store.loadJournal(k).then(t=>{ if(!loaded){ loaded=true; if(!ta.value) ta.value=t; } });
  ta.addEventListener('input',()=>{ state.textContent='…'; clearTimeout(timer); timer=setTimeout(async()=>{ try{ await store.saveJournal(k, ta.value); state.textContent='Saved'; }catch{ state.textContent='Not saved'; } },700); });
  sec.append(h('div',{class:'actions',style:'margin-top:4px;justify-content:space-between;align-items:center'},
    h('button',{class:'btn quiet sm',onclick:()=>{ S.today.promptShift=(S.today.promptShift||0)+1; store.save(); render(); }}, 'Different prompt'), state));
  sec.append(h('div',{style:'margin-top:12px'}, ta));
  sec.append(doneRow('journal',{label:'Done'}));
  return sec;
}

/* Kids */
function renderKids(){
  const idx = S.kids.pos % STORIES.length;
  const [title, ref, ask] = STORIES[idx];
  const sec = h('section',{class:'step'}, h('p',{class:'eyebrow'}, `Kids · story ${idx+1} of ${STORIES.length}`), h('h1',{}, title), h('p',{class:'ref',style:'font-size:20px;color:var(--ink-2)'}, ref));
  sec.append(h('p',{class:'muted',style:'margin-top:14px'}, h('strong',{style:'font-weight:600'},'Ask them: '), ask));
  const text = h('div',{class:'scripture'});
  const segs = parseRef(ref);
  let show=false;
  const toggle = h('button',{class:'btn quiet sm',onclick:()=>{ show=!show; text.hidden=!show; toggle.textContent=show?'Hide text':'Show text'; if(show&&!text.dataset.loaded&&segs){ text.dataset.loaded='1'; renderPassage(text, segs, {chapterLabels: segs.length>1}); } }}, 'Show text');
  sec.append(h('div',{class:'actions',style:'margin-top:8px'}, segs ? toggle : null, h('button',{class:'btn quiet sm',onclick:()=>{ S.kids.pos=(S.kids.pos+1)%STORIES.length; store.save(); render(); }}, 'Skip this one')));

/* ---------- progress ---------- */
function streaks(){
  const k = dayKey(); const hist = S.history;
  const has = d => !!(hist[d] && hist[d].done && hist[d].done.length);
  let cur=0, d = has(k) ? k : addDays(k,-1);
  while (has(d)) { cur++; d = addDays(d,-1); }
  let best=0, run=0, prev=null;
  for (const day of Object.keys(hist).sort()) { if (!has(day)) { run=0; prev=null; continue; } run = (prev && daysBetween(prev,day)===1) ? run+1 : 1; prev=day; best=Math.max(best,run); }
  return {cur, best:Math.max(best,cur)};
}

    h('div',{class:'form'}, h('h3',{},'Add your own verse'), h('div',{}, h('label',{for:'m-cref'},'Reference'), cref), h('div',{}, h('label',{for:'m-ctext'},'Text'), ctext), h('div',{}, h('button',{class:'btn sm',onclick:addCustom},'Add to review')))));

  // kids
  const ksel = h('select',{id:'m-kids'}, STORIES.map((s,i)=>h('option',{value:i,selected:i===S.kids.pos%STORIES.length},`${i+1}. ${s[0]} — ${s[1]}`)));
  ksel.addEventListener('change',()=>{ S.kids.pos=+ksel.value; store.save(); });
  root.append(h('section',{}, h('h2',{},'Kids’ stories'), h('label',{for:'m-kids'},'Next story'), ksel, h('p',{class:'notice'}, `${STORIES.length} stories from Genesis to Revelation, in order. Read from any Bible or story Bible — the reference is the anchor.`)));

  // journal
  const jl = h('div',{class:'jlist'}, h('p',{class:'tiny'},'Loading…'));
  store.listJournal().then(entries=>{ jl.replaceChildren(); if(!entries.length){ jl.append(h('p',{class:'empty'},'No entries yet.')); return; } for (const e of entries) jl.append(h('details',{}, h('summary',{}, e.date, h('span',{}, e.text.slice(0,60).replace(/\s+/g,' ')+(e.text.length>60?'…':''))), h('div',{class:'body'}, e.text))); });
  root.append(h('section',{}, h('h2',{},'Journal'), jl));

  root.append(h('section',{}, h('p',{class:'tiny'}, store.db ? 'Saved to this page’s private store; open it on any device.' : 'Saved in this browser only.')));
  return root;
}

/* ---------- boot ---------- */
(function boot(){
  const local = store.readLocal();
  if (local) S = migrate(local);
  ensureToday();
  render();
  window.addEventListener('hashchange', ()=>{ stepChosen=false; render(); });
  store.init();
  // roll over at midnight if the page is left open
  setInterval(()=>{ if (S.today.date !== dayKey()) { stepChosen=false; render(); } }, 60000);
})();
</script>
