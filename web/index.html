<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seek First</title>
<meta name="description" content="Fifteen quiet minutes: a passage in three translations, a longer reading, a gospel, prayer, memory work, a journal prompt, and a story for the kids.">
<meta name="theme-color" content="#20372e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seek First">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<style>
:root{
  --bg:#f3f4f0; --surface:#ffffff; --ink:#141a17; --ink-2:#4f5a54; --ink-3:#7d877f;
  --line:#d9ddd6; --line-2:#e8ebe6; --pine:#20372e; --pine-ink:#f3f4f0; --pine-soft:#e3eae5;
  --gold:#8a6512; --gold-fill:#f9c045; --good:#2f6b45; --danger:#9a3b2e;
  --h0:#e6e9e3; --h1:#cfdcd4; --h2:#a9c4b3; --h3:#7ea892; --h4:#4f8069; --h5:#20372e;
  --serif:"Literata",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1a221e; --ink:#ebe8de; --ink-2:#b0b8b1; --ink-3:#7f8a82;
    --line:#2c3730; --line-2:#222c26; --pine:#2f4a3e; --pine-ink:#f3f4f0; --pine-soft:#1f2c26;
    --gold:#f9c045; --gold-fill:#f9c045; --good:#7fc39a; --danger:#e08a7c;
    --h0:#222c26; --h1:#2c4437; --h2:#3a5d4a; --h3:#4f7d63; --h4:#75a98a; --h5:#a8d6bb;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a221e; --ink:#ebe8de; --ink-2:#b0b8b1; --ink-3:#7f8a82;
  --line:#2c3730; --line-2:#222c26; --pine:#2f4a3e; --pine-ink:#f3f4f0; --pine-soft:#1f2c26;
  --gold:#f9c045; --gold-fill:#f9c045; --good:#7fc39a; --danger:#e08a7c;
  --h0:#222c26; --h1:#2c4437; --h2:#3a5d4a; --h3:#4f7d63; --h4:#75a98a; --h5:#a8d6bb;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-inline:max(20px,env(safe-area-inset-left)) max(20px,env(safe-area-inset-right));
  padding-block:env(safe-area-inset-top) calc(64px + env(safe-area-inset-bottom));min-height:100vh}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:140px;font-family:var(--serif);font-size:17px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px 8px;border-bottom:1px solid var(--line)}
.wordmark{display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px}
.wordmark img{width:26px;height:26px;border-radius:50%;flex:none}
.wordmark small{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.nav{display:flex;gap:16px}
.nav a{font-size:13px;color:var(--ink-2);text-decoration:none;letter-spacing:.02em;padding:6px 0;white-space:nowrap}
.nav a:hover{color:var(--ink)}
@media (max-width:480px){.wordmark small{display:none}.nav{gap:12px}}
.steps{display:flex;gap:4px;padding-block:18px 6px;list-style:none;margin:0;padding-inline:0}
.steps li{flex:1;min-width:0}
.steps button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px 2px;border-radius:4px}
.steps .bar{display:block;width:100%;height:3px;background:var(--line);border-radius:2px}
.steps .lbl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.steps li.done .bar{background:var(--gold-fill)}
.steps li.cur .bar{background:var(--pine)}
.steps li.cur.done .bar{background:var(--gold-fill)}
.steps li.cur .lbl{color:var(--ink);font-weight:600}
.steps li.done .lbl::after{content:" ✓";color:var(--gold)}
.step{padding-block:22px 0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.2;margin:0 0 6px;text-wrap:balance;letter-spacing:-.005em}
h2{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.25;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.muted{color:var(--ink-2)}
.tiny{font-size:13px;color:var(--ink-3)}
.scripture{font-family:var(--serif);font-size:18px;line-height:1.65;max-width:62ch;margin:12px 0 0}
.scripture p{margin:0 0 .9em}
.scripture sup{font-family:var(--sans);font-size:10px;color:var(--ink-3);margin-right:4px;vertical-align:.45em}
.scripture .chap{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:1.2em 0 .5em}
/* reading tracks */
.track{border-top:1px solid var(--line);padding-block:18px}
.track:first-of-type{border-top:0;padding-top:6px}
.track .thead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.track .tlabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.track .tref{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1.2;margin:2px 0 0}
.track .ttitle{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:17px;margin:2px 0 0}
.tabs{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:7px 11px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tabs .spacer{flex:1}
.compare{margin-top:14px;display:flex;flex-direction:column;gap:16px}
.cverse{display:grid;gap:5px}
.cverse .vn{font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cverse .row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline}
.cverse .tr{font-family:var(--sans);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.cverse .tx{font-family:var(--serif);font-size:17px;line-height:1.55}
.cverse + .cverse{border-top:1px dashed var(--line-2);padding-top:14px}
.outlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.outlinks a{font-size:12px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.outlinks a:hover{border-color:var(--ink-3);color:var(--ink)}
.outlinks span{font-size:12px;color:var(--ink-3)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding-inline:8px}
.btn.quiet:hover{color:var(--ink)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.done-row{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;margin:8px 0 0}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line-2);align-items:start}
.item:first-child{border-top:0}
.item .who{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.3}
.item .what{color:var(--ink-2);font-size:15px;line-height:1.45;max-width:58ch}
.item .meta{font-size:12px;color:var(--ink-3)}
.item .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.item.prayed .who{color:var(--ink-3)}
.item.prayed .who::after{content:" ✓";color:var(--gold)}
.chip{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--pine-soft);padding:2px 8px;border-radius:999px;margin-right:6px}
.form{display:grid;gap:10px;margin-top:18px;padding:16px;border:1px dashed var(--line);border-radius:10px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.form .row{grid-template-columns:1fr}}
.form label,.manage label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.empty{padding:22px 0 6px;color:var(--ink-2);font-family:var(--serif);font-size:17px;max-width:52ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:14px}
.verse-block{font-family:var(--serif);font-size:20px;line-height:1.55;max-width:60ch;margin:10px 0 0}
.verse-block.hidden{filter:blur(7px);user-select:none;pointer-events:none}
.ref{font-family:var(--serif);font-weight:500;font-size:24px;margin:0}
.save-state{font-size:12px;color:var(--ink-3);min-width:60px;text-align:right}
.finish{padding-block:48px 20px}
.finish h1{font-size:34px}
.finish .cite{font-size:13px;color:var(--ink-3);margin-top:8px;letter-spacing:.03em}
/* chat */
.chat{margin-top:18px}
.chat .log{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.chat .msg{max-width:88%;padding:9px 13px;border-radius:14px;font-size:15px;line-height:1.45}
.chat .msg.me{align-self:flex-end;background:var(--pine);color:var(--pine-ink);border-bottom-right-radius:4px}
.chat .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat .msg.bot .act{display:block;margin-top:4px}
.chat .msg.bot .act button{color:var(--gold);font-size:13px;margin-left:8px;text-decoration:underline}
.chat .msg.bot .act .k{font-weight:600}
.chat .row{display:flex;gap:8px}
.chat .row input{flex:1;font-size:16px;border-radius:22px;padding:11px 16px}
.chat .row .btn{border-radius:22px;padding-inline:18px}
.chat .hint{font-size:13px;color:var(--ink-3);margin-top:8px}
details.formwrap{margin-top:14px}
details.formwrap summary{font-size:13px;color:var(--ink-3);cursor:pointer}
/* welcome */
.welcome{padding-block:28px 0;display:grid;gap:18px}
.welcome .panel{background:linear-gradient(160deg,#2f5443 0%,#20372e 55%,#172a22 100%);color:#f3f4f0;border-radius:18px;padding:44px 30px 38px;text-align:center}
.welcome .panel img{width:min(240px,70%);height:auto;display:block;margin:0 auto 18px}
.welcome .panel p{font-family:var(--serif);font-size:19px;line-height:1.4;max-width:30ch;margin:0 auto;text-wrap:balance;color:#e6e9e3}
.welcome .card{padding:22px 20px}
.welcome .card p{margin:0 0 14px}
/* progress */
.prog section{padding-block:24px;border-bottom:1px solid var(--line)}
.prog section:last-child{border-bottom:0}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:22px 6px}
@media (max-width:480px){.hero{gap:8px}}
.hero .n{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.heat .c{width:14px;height:14px;border-radius:3px;background:var(--h0)}
.heat .c[data-n="1"]{background:var(--h1)} .heat .c[data-n="2"]{background:var(--h2)} .heat .c[data-n="3"]{background:var(--h3)} .heat .c[data-n="4"]{background:var(--h4)} .heat .c[data-n="5"]{background:var(--h5)}
.heat .c.future{background:transparent;border:1px dashed var(--line)}
.heat .c.today{outline:2px solid var(--gold-fill);outline-offset:1px}
.heat-cap{font-size:13px;color:var(--ink-2);margin-top:8px;min-height:20px}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);margin-top:8px}
.legend .c{width:12px;height:12px;border-radius:3px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;margin-top:14px}
.bar-row .name{font-weight:500}
.bar-row .val{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar-row .track2{grid-column:1/-1;height:8px;background:var(--h0);border-radius:4px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--h5);border-radius:4px;min-width:2px}
.bar-row .sub{grid-column:1/-1;font-size:13px;color:var(--ink-3)}
.dots{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-top:12px}
@media (max-width:520px){.dots{grid-template-columns:1fr;gap:4px}.dots .sname{margin-top:8px}}
.dots .sname{font-size:12px;color:var(--ink-3);white-space:nowrap}
.dots .rowd{display:flex;gap:5px;flex-wrap:wrap}
.dots .d{width:16px;height:16px;border-radius:50%;background:var(--h0);border:2px solid transparent}
.dots .d.review{background:var(--h5)} .dots .d.learning{border-color:var(--gold-fill);background:transparent} .dots .d.paused{border-color:var(--ink-3);background:transparent}
.miles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mile{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3)}
.mile.hit{border-color:var(--gold-fill);color:var(--ink);background:color-mix(in srgb,var(--gold-fill) 18%,transparent)}
.mile.hit::before{content:"✓ ";color:var(--gold)}
/* manage */
.manage section{padding-block:26px;border-bottom:1px solid var(--line)}
.manage section:last-child{border-bottom:0}
.manage .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:480px){.manage .row2{grid-template-columns:1fr}}
.tms-list .series{font-family:var(--serif);font-weight:500;font-size:17px;margin:18px 0 4px}
.tms-list .series:first-child{margin-top:8px}
.tms-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:9px 0;border-top:1px solid var(--line-2);align-items:center;font-size:14px}
.tms-row .t{color:var(--ink-3);font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.tms-row .st{font-size:12px;color:var(--ink-3)}
.tms-row .st.learning{color:var(--gold)} .tms-row .st.review{color:var(--good)}
.jlist details{border-top:1px solid var(--line-2);padding:8px 0}
.jlist summary{cursor:pointer;font-weight:500}
.jlist summary span{color:var(--ink-3);font-weight:400;font-size:13px;margin-left:10px}
.jlist .body{font-family:var(--serif);font-size:16px;white-space:pre-wrap;color:var(--ink-2);margin-top:8px}
.notice{font-size:13px;color:var(--ink-3);margin-top:10px}
/* print sheet */
.sheet{background:var(--surface);border:1px solid var(--line);padding:26px 28px;margin-top:16px;font-size:14px;line-height:1.4}
.sheet .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.sheet .mast .wm{font-family:var(--serif);font-style:italic;font-size:20px}
.sheet .mast .dt{font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
@media (max-width:560px){.sheet .cols{grid-template-columns:1fr}}
.sheet .blk{margin-bottom:14px;break-inside:avoid}
.sheet h4{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 5px;padding-bottom:3px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.sheet .big{font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.25;margin:0 0 2px}
.sheet .v{font-family:var(--serif);font-size:14px;line-height:1.45;margin:4px 0}
.sheet .box{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ink);border-radius:2px;vertical-align:-1px;margin-right:7px}
.sheet .pl{margin:0;padding:0;list-style:none}
.sheet .pl li{padding:3px 0;font-size:13.5px}
.sheet .line{border-bottom:1px solid var(--line);height:22px}
.sheet .small{font-size:12px;color:var(--ink-3)}
.sheet .passage{margin-top:8px;column-count:2;column-gap:22px;font-family:var(--serif);font-size:12.5px;line-height:1.45}
.sheet .passage p{margin:0 0 .6em}
.sheet .passage sup{font-family:var(--sans);font-size:8px;color:var(--ink-3);margin-right:2px}
.sheet .passage .chap{column-span:all;font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 4px}
@media (max-width:560px){.sheet .passage{column-count:1}}
@media print{
  @page{margin:13mm 14mm}
  html,body{background:#fff!important;color:#000!important;padding:0!important;font-size:12.5px}
  header,.noprint{display:none!important}
  .wrap{max-width:none}
  .sheet{border:0;padding:0;margin:0;color:#000;--ink:#000;--ink-2:#222;--ink-3:#555;--line:#999;--surface:#fff}
  a{color:inherit;text-decoration:none}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.verse-block{transition:filter .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark"><img src="assets/icon.png" alt="" width="26" height="26">Seek First <small id="dateLabel"></small></div>
    <nav class="nav"><a href="#" id="navToday">← Today</a><a href="#progress" id="navProgress">Progress</a><a href="#print" id="navPrint">Sheet</a><a href="#manage" id="navManage">Manage</a></nav>
  </header>

s","topic":"His Spirit","ref":"1 Corinthians 2:12","text":"But we received, not the spirit of the world, but the Spirit which is from God, that we might know the things that were freely given to us by God."},{"series":"C. Reliance on God's Resources","topic":"His Strength","ref":"Isaiah 41:10","text":"Don't you be afraid, for I am with you; don't be dismayed, for I am your God; I will strengthen you; yes, I will help you; yes, I will uphold you with the right hand of my righteousness."},{"series":"C. Reliance on God's Resources","topic":"His Strength","ref":"Philippians 4:13","text":"I can do all things through Christ, who strengthens me."},{"series":"C. Reliance on God's Resources","topic":"His Faithfulness","ref":"Lamentations 3:22-23","text":"It is of Yahweh's loving kindnesses that we are not consumed, because his compassion doesn't fail. They are new every morning; great is your faithfulness."},{"series":"C. Reliance on God's Resources","topic":"His Faithfulness","ref":"Numbers 23:19","text":"God is not a man, that he should lie, Neither the son of man, that he should repent: Has he said, and will he not do it? Or has he spoken, and will he not make it good?"},{"series":"C. Reliance on God's Resources","topic":"His Peace","ref":"Isaiah 26:3","text":"You will keep him in perfect peace, whose mind is stayed on you; because he trusts in you."},{"series":"C. Reliance on God's Resources","topic":"His Peace","ref":"1 Peter 5:7","text":"casting all your worries on him, because he cares for you."},{"series":"C. Reliance on God's Resources","topic":"His Provision","ref":"Romans 8:32","text":"He who didn't spare his own Son, but delivered him up for us all, how would he not also with him freely give us all things?"},{"series":"C. Reliance on God's Resources","topic":"His Provision","ref":"Philippians 4:19","text":"My God will supply every need of yours according to his riches in glory in Christ Jesus."},{"series":"C. Reliance on God's Resources","topic":"His Help in Temptation","ref":"Hebrews 2:18","text":"For in that he himself has suffered being tempted, he is able to help those who are tempted."},{"series":"C. Reliance on God's Resources","topic":"His Help in Temptation","ref":"Psalm 119:9, 11","text":"How can a young man keep his way pure? By living according to your word. I have hidden your word in my heart, That I might not sin against you."},{"series":"D. Being Christ's Disciple","topic":"Put Christ First","ref":"Matthew 6:33","text":"But seek first God's Kingdom, and his righteousness; and all these things will be given to you as well."},{"series":"D. Being Christ's Disciple","topic":"Put Christ First","ref":"Luke 9:23","text":"He said to all, \"If anyone desires to come after me, let him deny himself, take up his cross,TR, NU add \"daily\" and follow me."},{"series":"D. Being Christ's Disciple","topic":"Separate from the World","ref":"1 John 2:15-16","text":"Don't love the world, neither the things that are in the world. If anyone loves the world, the Father's love isn't in him. For all that is in the world, the lust of the flesh, the lust of the eyes, and the pride of life, isn't the Father's, but is the world's."},{"series":"D. Being Christ's Disciple","topic":"Separate from the World","ref":"Romans 12:2","text":"Don't be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God."},{"series":"D. Being Christ's Disciple","topic":"Be Steadfast","ref":"1 Corinthians 15:58","text":"Therefore, my beloved brothers, be steadfast, immovable, always abounding in the Lord's work, because you know that your labor is not in vain in the Lord."},{"series":"D. Being Christ's Disciple","topic":"Be Steadfast","ref":"Hebrews 12:3","text":"For consider him who has endured such contradiction of sinners against himself, that you don't grow weary, fainting in your souls."},{"series":"D. Being Christ's Disciple","topic":"Serve Others","ref":"Mark 10:45","text":"For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many.\""},{"series":"D. Being Christ's Disciple","topic":"Serve Others","ref":"2 Corinthians 4:5","text":"For we don't preach ourselves, but Christ Jesus as Lord, and ourselves as your servants for Jesus' sake;"},{"series":"D. Being Christ's Disciple","topic":"Give Generously","ref":"Proverbs 3:9-10","text":"Honor Yahweh with your substance, With the first fruits of all your increase: So your barns will be filled with plenty, And your vats will overflow with new wine."},{"series":"D. Being Christ's Disciple","topic":"Give Generously","ref":"2 Corinthians 9:6-7","text":"Remember this: he who sows sparingly will also reap sparingly. He who sows bountifully will also reap bountifully. Let each man give according as he has determined in his heart; not grudgingly, or under compulsion; for God loves a cheerful giver."},{"series":"D. Being Christ's Disciple","topic":"Develop World Vision","ref":"Acts 1:8","text":"But you will receive power when the Holy Spirit has come upon you. You will be witnesses to me in Jerusalem, in all Judea and Samaria, and to the uttermost parts of the earth.\""},{"series":"D. Being Christ's Disciple","topic":"Develop World Vision","ref":"Matthew 28:19-20","text":"Therefore go, and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all things that I commanded you. Behold, I am with you always, even to the end of the age.\" Amen."},{"series":"E. Growth in Christlikeness","topic":"Love","ref":"John 13:34-35","text":"A new commandment I give to you, that you love one another, just like I have loved you; that you also love one another. By this everyone will know that you are my disciples, if you have love for one another.\""},{"series":"E. Growth in Christlikeness","topic":"Love","ref":"1 John 3:18","text":"My little children, let's not love in word only, neither with the tongue only, but in deed and truth."},{"series":"E. Growth in Christlikeness","topic":"Humility","ref":"Philippians 2:3-4","text":"doing nothing through rivalry or through conceit, but in humility, each counting others better than himself; each of you not just looking to his own things, but each of you also to the things of others."},{"series":"E. Growth in Christlikeness","topic":"Humility","ref":"1 Peter 5:5-6","text":"Likewise, you younger ones, be subject to the elder. Yes, all of you gird yourselves with humility, to subject yourselves to one another; for \"God resists the proud, but gives grace to the humble.\" Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time;"},{"series":"E. Growth in Christlikeness","topic":"Purity","ref":"Ephesians 5:3","text":"But sexual immorality, and all uncleanness, or covetousness, let it not even be mentioned among you, as becomes saints;"},{"series":"E. Growth in Christlikeness","topic":"Purity","ref":"1 Peter 2:11","text":"Beloved, I beg you as foreigners and pilgrims, to abstain from fleshly lusts, which war against the soul;"},{"series":"E. Growth in Christlikeness","topic":"Honesty","ref":"Leviticus 19:11","text":"\"'You shall not steal; neither shall you deal falsely, nor lie to one another."},{"series":"E. Growth in Christlikeness","topic":"Honesty","ref":"Acts 24:16","text":"Herein I also practice always having a conscience void of offense toward God and men."},{"series":"E. Growth in Christlikeness","topic":"Faith","ref":"Hebrews 11:6","text":"Without faith it is impossible to be well pleasing to him, for he who comes to God must believe that he exists, and that he is a rewarder of those who seek him."},{"series":"E. Growth in Christlikeness","topic":"Faith","ref":"Romans 4:20-21","text":"Yet, looking to the promise of God, he didn't waver through unbelief, but grew strong through faith, giving glory to God, and being fully assured that what he had promised, he was able also to perform."},{"series":"E. Growth in Christlikeness","topic":"Good Works","ref":"Galatians 6:9-10","text":"Let us not be weary in doing good, for we will reap in due season, if we don't give up. So then, as we have opportunity, let's do what is good toward all men, and especially toward those who are of the household of the faith."},{"series":"E. Growth in Christlikeness","topic":"Good Works","ref":"Matthew 5:16","text":"Even so, let your light shine before men; that they may see your good works, and glorify your Father who is in heaven."}]</script>

  {id:'read',  label:'Read'},

/* ====================== sections ====================== */
// A "section" is one reading: [chapter, startVerse, endChapter, endVerse, title, reference].
// Hand-drawn for the books below; elsewhere chapters are split into even pieces.
const sectionCache = {};
function sectionsFor(b){
  if (sectionCache[b]) return sectionCache[b];
  if (SECTION_DATA[b]) return (sectionCache[b] = SECTION_DATA[b]);
  const vc = BOOK[b].vc, out = [];
  for (let c=1;c<=vc.length;c++){
    const n = vc[c-1], parts = Math.max(1, Math.round(n/14)), size = Math.ceil(n/parts);
    for (let v=1;v<=n;v+=size){
      const end = Math.min(n, v+size-1);
      out.push([c, v, c, end, '', `${bookName(b)} ${c}:${v}${end>v?'-'+end:''}`]);
    }
  }
  return (sectionCache[b] = out);
}

/* ====================== dates ====================== */
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (key,n) => { const [y,m,d]=key.split('-').map(Number); return dayKey(new Date(y,m-1,d+n)); };
const daysBetween = (a,b) => { const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5); };
const ago = key => { if(!key) return 'never'; const n=daysBetween(key,dayKey()); return n===0?'today':n===1?'yesterday':`${n} days ago`; };
const shortDate = key => { const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
const longDate = () => new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const greeting = () => { const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; };
const uid = () => Math.random().toString(36).slice(2,10);

/* ====================== state (this device only) ====================== */
const LS_STATE = 'seekfirst.state';
const LS_JOURNAL = 'seekfirst.journal.';

// Defaults match where you said you are: 1 Corinthians for study, Exodus 29 for the
// longer reading, Mark for the gospel, and TMS series A+B in review with C under way.
function defaultState(){
  const k = dayKey();
  const cards = [];
  for (let i=0;i<24;i++){                       // series A and B: known, but rusty
    const v = TMS[i];
    cards.push({id:uid(), tms:i, ref:v.ref, text:v.text, topic:v.topic, series:v.series,
      status:'review', reps:3, lastRep:'', interval:2, due:addDays(k, Math.floor(i/2)), added:k});
  }
  const cur = TMS[24];                          // C · His Spirit · 1 Corinthians 3:16
  cards.push({id:uid(), tms:24, ref:cur.ref, text:cur.text, topic:cur.topic, series:cur.series,
    status:'learning', reps:0, lastRep:'', interval:0, due:'', added:k});
  return {
    v:2, name:'', updatedAt:0,
    plan:{tracks:[
      {id:'study',  label:'Study',      book:46, idx:idxOf(46,3,10), compare:true},
      {id:'long',   label:'Longer read',book:2,  idx:idxOf(2,29,1),  compare:false},
      {id:'gospel', label:'Gospel',     book:41, idx:0,              compare:false},
    ]},
    prayer:{items:[], perDay:4},
    memory:{cards, nextTms:25},
    kids:{pos:0},
    history:{},
    today:{date:'', done:{}, prayIds:[], promptShift:0, prayed:0, reviewed:0},
  };
}
function idxOf(b, c, v){
  const secs = sectionsFor(b);
  const i = secs.findIndex(s => s[0]===c && s[1]===v);
  return i < 0 ? 0 : i;
}

let S = defaultState();
let currentStep = 0, stepChosen = false;

function ensureToday(){
  const k = dayKey();
  if (S.today.date !== k) S.today = {date:k, done:{}, prayIds:[], promptShift:0, prayed:0, reviewed:0};
  for (const t of S.plan.tracks) { const n = sectionsFor(t.book).length; if (t.idx >= n || t.idx < 0) t.idx = 0; }
}
function migrate(d){
  const base = defaultState();
  const out = Object.assign(base, d, {
    plan: d.plan && Array.isArray(d.plan.tracks) && d.plan.tracks.length ? d.plan : base.plan,
    prayer:{...base.prayer, ...d.prayer},
    memory:{...base.memory, ...d.memory},
    kids:{...base.kids, ...d.kids},
    history:{...(d.history||{})},
    today:{...base.today, ...d.today},
  });
  out.v = 2;
  return out;
}
function syncHistory(){
  if (!S.today.date) return;
  const done = Object.keys(S.today.done).filter(k=>S.today.done[k]);
  if (done.length || S.today.prayed || S.today.reviewed) S.history[S.today.date] = {done, prayed:S.today.prayed||0, reviewed:S.today.reviewed||0};
  else delete S.history[S.today.date];
  const keys = Object.keys(S.history).sort();
  while (keys.length > 800) delete S.history[keys.shift()];
}
const store = {
  downloads:null,
  save(){
    syncHistory();
    S.updatedAt = Date.now();
    try { localStorage.setItem(LS_STATE, JSON.stringify(S)); } catch(e) { console.warn('save failed', e); }
  },
  load(){ try { const s = localStorage.getItem(LS_STATE); return s ? JSON.parse(s) : null; } catch { return null; } },
  loadJournal(date){ try { return localStorage.getItem(LS_JOURNAL+date) || ''; } catch { return ''; } },
  saveJournal(date,text){ try { if (text.trim()) localStorage.setItem(LS_JOURNAL+date, text); else localStorage.removeItem(LS_JOURNAL+date); } catch(e){ throw e; } },
  listJournal(){
    const out=[];
    try { for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith(LS_JOURNAL)){ const t=localStorage.getItem(k); if(t&&t.trim()) out.push({date:k.slice(LS_JOURNAL.length),text:t}); } } } catch {}
    return out.sort((a,b)=>a.date<b.date?1:-1);
  },
  backup(){
    const journal = {}; for (const e of this.listJournal()) journal[e.date] = e.text;
    return JSON.stringify({app:'seek-first', version:2, exported:new Date().toISOString(), state:S, journal}, null, 1);
  },
  restore(text){
    const data = JSON.parse(text);
    if (!data || data.app !== 'seek-first' || !data.state) throw new Error('That file is not a Seek First backup.');
    S = migrate(data.state); ensureToday();
    if (data.journal) for (const [d,t] of Object.entries(data.journal)) this.saveJournal(d, String(t));
    this.save();
  },
};

/* ====================== bible text ====================== */
const bookCache = {};
async function loadBook(tr, b){
  const key = tr+'/'+b;
  if (bookCache[key]) return bookCache[key];
  const r = await fetch(`bible/${tr}/${b}.json`);
  if (!r.ok) throw new Error('no text');
  return (bookCache[key] = await r.json());
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function segmentsOf(sec, b){
  const [c1,v1,c2,v2] = sec, vc = BOOK[b].vc, segs = [];
  for (let c=c1;c<=c2;c++) segs.push({b, c, v1: c===c1?v1:1, v2: c===c2?v2:vc[c-1]});
  return segs;
}
async function renderPassage(el, tr, b, segs, {chapterLabels=false}={}){
  el.innerHTML = '<p class="tiny">Loading…</p>';
  try {
    const book = await loadBook(tr, b);
    let html = '';
    for (const s of segs){
      const verses = book[s.c-1] || [];
      if (chapterLabels) html += `<div class="chap">${esc(bookName(b))} ${s.c}</div>`;
      html += '<p>' + verses.slice(s.v1-1, s.v2).map((t,i)=>`<sup>${s.v1+i}</sup>${esc(t)}`).join(' ') + '</p>';
    }
    el.innerHTML = html;
  } catch { el.innerHTML = '<p class="tiny">Text unavailable offline — open it in your own Bible.</p>'; }
}
async function renderCompare(el, b, segs){
  el.innerHTML = '<p class="tiny">Loading three translations…</p>';
  try {
    const books = await Promise.all(TRANSLATIONS.map(t=>loadBook(t.id, b)));
    const frag = document.createDocumentFragment();
    for (const s of segs){
      for (let v=s.v1; v<=s.v2; v++){
        const block = h('div',{class:'cverse'}, h('div',{class:'vn'}, `${bookName(b)} ${s.c}:${v}`));
        TRANSLATIONS.forEach((t,i)=>{
          const text = (books[i][s.c-1]||[])[v-1] || '';
          block.append(h('div',{class:'row'}, h('div',{class:'tr'}, t.name), h('div',{class:'tx'}, text)));
        });
        frag.append(block);
      }
    }
    el.replaceChildren(frag);
  } catch { el.innerHTML = '<p class="tiny">Text unavailable offline — open it in your own Bible.</p>'; }
}
function gatewayUrl(version, ref){
  return `https://www.biblegateway.com/passage/?search=${encodeURIComponent(ref)}&version=${version}`;
}

function todaysReading(){
  return S.plan.tracks.map(t => {
    const secs = sectionsFor(t.book);
    const sec = secs[Math.min(t.idx, secs.length-1)];
    return {track:t, sec, segs:segmentsOf(sec, t.book), ref:sec[5], title:sec[4], count:secs.length};
  });
}
function advanceReading(){
  for (const t of S.plan.tracks) t.idx = (t.idx + 1) % sectionsFor(t.book).length;
}

/* ====================== prayer ====================== */
const isActive = p => !p.answered && !p.ended;
function ensurePrayerSelection(){
  const k = dayKey();
  for (const p of S.prayer.items) if (isActive(p) && p.until && p.until < k) p.ended = k;
  const valid = new Set(S.prayer.items.filter(isActive).map(p=>p.id));
  S.today.prayIds = (S.today.prayIds||[]).filter(id=>valid.has(id));
  if (!S.today.prayIds.length && valid.size) S.today.prayIds = pickPrayers();
}
function pickPrayers(){
  const active = S.prayer.items.filter(isActive);
  const daily = active.filter(p=>p.daily);
  const rest = active.filter(p=>!p.daily).sort((a,b)=>
    (a.lastPrayed||'') < (b.lastPrayed||'') ? -1 : (a.lastPrayed||'') > (b.lastPrayed||'') ? 1 : a.added < b.added ? -1 : 1);
  return [...daily, ...rest.slice(0, Math.max(0, S.prayer.perDay))].map(p=>p.id);
}
function addRequest(o){
  const who = (o.who||'').trim().slice(0,80);
  if (!who) return null;
  const item = {id:uid(), who, what:(o.what||'').trim().slice(0,200), cat:PRAY_CATS.includes(o.cat)?o.cat:'Friends',
    daily:!!o.daily, until:/^\d{4}-\d{2}-\d{2}$/.test(o.until||'')?o.until:'',
    added:dayKey(), lastPrayed:'', count:0, answered:'', ended:''};
  S.prayer.items.push(item);
  if (item.daily || S.today.prayIds.length < S.prayer.perDay) S.today.prayIds.push(item.id);
  return item;
}

/* Plain words in, prayer-list actions out. All of this runs here in the browser. */
const TITLES = /^(pastor|rev|reverend|fr|father|dr|mr|mrs|ms|miss|uncle|aunt|grandma|grandpa|nana|papa)\b/i;
const CAT_RULES = [
  [/\b(mom|mum|dad|mother|father|wife|husband|son|daughter|kids?|children|child|brother|sister|sibling|grand\w+|family|parents?|in-laws?|niece|nephew|cousin)\b/i, 'Family'],
  [/\b(church|pastor|elders?|deacons?|small group|life group|congregation|sunday school|youth group|worship team|missions? committee)\b/i, 'Church'],
  [/\b(missionar\w+|nation|country|world|persecuted|war|famine|refugees?|earthquake|hurricane|election|government|president|unreached)\b/i, 'World'],
];
function inferCat(who, what){
  const b = (who + ' ' + what).toLowerCase();
  if (/^(me|myself|i|my own)\b/.test(who.trim().toLowerCase())) return 'Me';
  for (const [re, cat] of CAT_RULES) if (re.test(b)) return cat;
  return 'Friends';
}
function titleCase(s){
  const t = s.trim();
  return t ? t[0].toUpperCase() + t.slice(1) : t;
}
function parseDuration(text, k){
  const m = text.match(/\b(today|tomorrow|this week|next week|this month|this year|for (?:the )?(?:next )?(\d+)\s*(day|days|week|weeks|month|months))\b/i);
  if (!m) return {until:'', rest:text};
  const w = m[0].toLowerCase();
  let until = '';
  if (w === 'today') until = k;
  else if (w === 'tomorrow') until = addDays(k,1);
  else if (w === 'this week') until = addDays(k,7);
  else if (w === 'next week') until = addDays(k,14);
  else if (w === 'this month') until = addDays(k,30);
  else if (w === 'this year') until = addDays(k,365);
  else { const n = +m[2], unit = m[3].toLowerCase(); until = addDays(k, n * (unit.startsWith('week')?7:unit.startsWith('month')?30:1)); }
  return {until, rest: text.replace(m[0], ' ')};
}
function findExisting(name){
  const n = name.trim().toLowerCase().replace(/[.,!?]+$/,'');
  if (!n) return null;
  const active = S.prayer.items.filter(isActive);
  return active.find(p => p.who.toLowerCase() === n)
      || active.find(p => n.includes(p.who.toLowerCase()) || p.who.toLowerCase().includes(n))
      || null;
}
function parseNote(text){
  const k = dayKey();
  const t = text.trim().replace(/\s+/g,' ');
  if (!t) return {actions:[], reply:''};

  // Something resolved?
  let m = t.match(/^(?:answered|praise|praise god (?:for|that)|thank god (?:for|that)|good news)\s*[:,-]?\s*(.+)$/i)
       || t.match(/^(?:take|remove|delete|drop)\s+(.+?)\s*(?:off|from)?\s*(?:the |my )?list\.?$/i)
       || t.match(/^stop praying for\s+(.+)$/i)
       || t.match(/^(.+?)(?:'s\b[^,]*)?\s+(?:went well|is better|is healed|is home|came through|got the job|worked out|is resolved|arrived safely)\b.*$/i);
  if (m) {
    const removing = /^(?:take|remove|delete|drop|stop praying)/i.test(t);
    const subject = m[1].replace(/^(?:for|that)\s+/i,'');
    const p = findExisting(subject) || findExisting(subject.split(/\s+/)[0]);
    if (p) return {actions:[{type: removing ? 'remove' : 'answered', id:p.id}], reply:''};
    if (removing || /^(?:answered|praise)/i.test(t)) return {actions:[], reply:`I couldn't find "${subject}" on your list.`};
  }

  // A new request.
  let body = t.replace(/^(?:please\s+)?(?:praying|prayers?|pray|remembering|remember|lifting up|lift up)\b\s*(?:for|about|over)?\s*/i, '');
  const dur = parseDuration(body, k); body = dur.rest;
  const daily = /\b(every ?day|daily|each day|each morning)\b/i.test(body);
  body = body.replace(/\b(every ?day|daily|each day|each morning)\b/i, ' ').replace(/\s+/g,' ').trim().replace(/[.;,]+$/,'');
  if (!body) return {actions:[], reply:'Who should I add?'};

  // "Mike and Sarah about the move" → one entry each.
  let whoPart = body, whatPart = '';
  const split = body.match(/^(.*?)\s*(?:—|–|\s-\s|:)\s*(.+)$/)
             || body.match(/^(.*?)\s+(?:about|regarding|re:?|who|whose|that|as he|as she|as they|needs?|needing|struggling with|dealing with|going through)\s+(.+)$/i)
             || body.match(/^(.*?),\s*(.+)$/);
  if (split) { whoPart = split[1]; whatPart = split[2]; }
  else {                                                     // a plain sentence: split at the verb
    const words = body.split(/\s+/);
    const cut = words.findIndex((w,i) => i>0 && i<=3 && /^(is|are|has|have|was|were|will|needs?|wants?|starts?|started|goes|went|had|just)$/i.test(w));
    if (cut > 0) { whoPart = words.slice(0,cut).join(' '); whatPart = words.slice(cut).join(' '); }
  }
  whoPart = whoPart.replace(/^(?:my|our|the)\s+/i,'').trim();
  whatPart = whatPart.trim().replace(/[.;,]+$/,'').replace(/^(?:is|are|was|were|has|have|will be|will|just)\s+/i,'');

  const names = whoPart.split(/\s*(?:,| and | & )\s*/i).map(s=>s.trim()).filter(Boolean);
  const multi = names.length > 1 && names.every(n => n.split(/\s+/).length <= 3);
  const list = multi ? names : [whoPart];
  const actions = list.map(who => {
    const clean = TITLES.test(who) ? titleCase(who) : titleCase(who.replace(/^(?:my|our)\s+/i,''));
    return {type:'add', who:clean, what:whatPart, cat:inferCat(clean, whatPart), daily, until:dur.until};
  }).filter(a => a.who);
  return actions.length ? {actions, reply:''} : {actions:[], reply:"I couldn't make a request out of that — try “pray for Ana about her surgery this week”."};
}

/* ====================== memory ====================== */
function ensureLearningCard(){
  if (S.memory.cards.some(c=>c.status==='learning')) return;
  while (S.memory.nextTms < TMS.length && S.memory.cards.some(c=>c.tms===S.memory.nextTms)) S.memory.nextTms++;
  if (S.memory.nextTms >= TMS.length) return;
  const v = TMS[S.memory.nextTms];
  S.memory.cards.push({id:uid(), tms:S.memory.nextTms, ref:v.ref, text:v.text, topic:v.topic, series:v.series,
    status:'learning', reps:0, lastRep:'', interval:0, due:'', added:dayKey()});
  S.memory.nextTms++;
}
const dueReviews = () => { const k=dayKey(); return S.memory.cards.filter(c=>c.status==='review' && c.due && c.due<=k).sort((a,b)=>a.due<b.due?-1:1); };
function promoteToReview(card, interval=2){ card.status='review'; card.interval=interval; card.due=addDays(dayKey(),interval); }
function gradeReview(card, ok){
  const k = dayKey();
  if (ok) { card.interval = Math.max(1, Math.round((card.interval||1)*2.2)); card.due = addDays(k, Math.min(card.interval,120)); card.reps=(card.reps||0)+1; }
  else { card.interval = 1; card.due = addDays(k,1); }
  card.lastRep = k; S.today.reviewed = (S.today.reviewed||0)+1;
}

const app = document.getElementById('app');
const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k==='class') el.className=v;
    else if (k==='html') el.innerHTML=v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v===false||v==null) {}
    else el.setAttribute(k, v===true?'':v);
  }
  for (const c of kids.flat()) if (c!=null) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
};

function handleChat(text, log, input){
  const me = h('div',{class:'msg me'}, text); log.append(me);
  const result = parseNote(text);
  const bot = h('div',{class:'msg bot'});
  let n = 0;
  for (const a of result.actions){
    if (a.type === 'add'){
      const it = addRequest(a); if (!it) continue; n++;
      const line = h('span',{class:'act'},'Added ', h('span',{class:'k'}, it.who),
        it.what ? ` — ${it.what}` : '',
        ` · ${it.cat}${it.daily?' · daily':''}${it.until?' · through '+shortDate(it.until):''}`,
        h('button',{onclick:()=>{ S.prayer.items = S.prayer.items.filter(x=>x.id!==it.id); S.today.prayIds = S.today.prayIds.filter(x=>x!==it.id); store.save(); line.replaceChildren('Removed ', h('span',{class:'k'}, it.who)); rerenderPray(); }},'undo'));
      bot.append(line);
    } else {
      const p = S.prayer.items.find(x=>x.id===a.id); if (!p) continue; n++;
      const prev = {answered:p.answered, ended:p.ended};
      if (a.type === 'answered') p.answered = dayKey(); else p.ended = dayKey();

      bot.append(line);
    }
  }
  if (!n) bot.append(result.reply || "I couldn't make a request out of that.");
  log.append(bot);
  chatLog.push(me, bot);
  if (n) { store.save(); rerenderPray(); }
  input.focus();
}

/* ====================== progress ====================== */
function streaks(){
  const k = dayKey(), hist = S.history;
  const has = d => !!(hist[d] && hist[d].done && hist[d].done.length);
  let cur = 0, d = has(k) ? k : addDays(k,-1);
  while (has(d)) { cur++; d = addDays(d,-1); }
  let best = 0, run = 0, prev = null;
  for (const day of Object.keys(hist).sort()){
    if (!has(day)) { run=0; prev=null; continue; }
    run = (prev && daysBetween(prev,day)===1) ? run+1 : 1; prev = day; best = Math.max(best, run);
  }
  return {cur, best: Math.max(best, cur)};
}
function renderProgress(){
  syncHistory();
  const k = dayKey(), hist = S.history, st = streaks();
  const days = Object.values(hist).filter(d=>d.done && d.done.length);
  const fullDays = days.filter(d=>d.done.length===STEPS.length).length;
  const prayed = S.prayer.items.reduce((n,p)=>n+(p.count||0),0);
  const answered = S.prayer.items.filter(p=>p.answered).length;

  const root = h('div',{class:'prog'});

    h('div',{}, h('div',{class:'n'}, st.cur), h('div',{class:'l'},'day streak')),
    h('div',{}, h('div',{class:'n'}, fullDays), h('div',{class:'l'},'full days')),
    h('div',{}, h('div',{class:'n'}, inReview), h('div',{class:'l'},'verses by heart'))));
  const start = addDays(k, -(new Date().getDay() + 15*7));
  const grid = h('div',{class:'heat',role:'img','aria-label':'Steps completed per day over the last 16 weeks'});
  const shown = Object.keys(hist).filter(d=>d>=start && hist[d].done.length).length;
  const cap = h('div',{class:'heat-cap'}, `Steps done each day · showed up ${shown} of the last ${daysBetween(start,k)+1} days`);
  for (let i=0;i<16*7;i++){
    const d = addDays(start,i), n = hist[d] ? hist[d].done.length : 0, future = d > k;
    const c = h('div',{class:'c'+(future?' future':'')+(d===k?' today':''), 'data-n':future?0:n, title:future?'':`${d} · ${n} of 5`});
    if (!future){
      const show = () => { cap.textContent = `${shortDate(d)} · ${n} of 5 steps${hist[d]&&hist[d].prayed?` · prayed for ${hist[d].prayed}`:''}${hist[d]&&hist[d].reviewed?` · reviewed ${hist[d].reviewed}`:''}`; };
      c.addEventListener('mouseenter', show); c.addEventListener('click', show);
    }
    grid.append(c);
  }
  root.append(h('section',{}, h('h2',{},'Showing up'),
    h('p',{class:'muted'}, `Best streak ${st.best} day${st.best===1?'':'s'}. A day counts when you finish at least one step; the shade is how many of the five.`),
    grid, cap, h('div',{class:'legend'},'none', ...[1,2,3,4,5].map(n=>h('span',{class:'c',style:`background:var(--h${n})`})),'all five')));
  const plan = h('section',{}, h('h2',{},'Reading'));

  }

async function ensureJsPdf(){
  if (window.jspdf?.jsPDF) return window.jspdf.jsPDF;
  await new Promise((res,rej)=>{ const el=document.createElement('script'); el.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; el.onload=res; el.onerror=()=>rej(new Error('PDF library needs a connection the first time')); document.head.appendChild(el); });
  return window.jspdf.jsPDF;
}
async function buildPdf(includeText){
  const JsPDF = await ensureJsPdf();
  const d = sheetData();
  const doc = new JsPDF({unit:'pt', format:'letter'});
  const W=612, H=792, M=46, gap=26, colW=(W-2*M-gap)/2, L=M, R=M+colW+gap;
  let y = M+6;
  doc.setFont('times','italic'); doc.setFontSize(16); doc.setTextColor(0); doc.text('Seek First', L, y+10);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(60); doc.text(d.dateLong.toUpperCase(), W-M, y+10, {align:'right'});
  y += 20; doc.setDrawColor(0); doc.setLineWidth(1.2); doc.line(L, y, W-M, y); y += 16;
  const col = {L:y, R:y}, X = s => s==='L' ? L : R;
  const label = (s,t) => { doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(80); doc.text(t.toUpperCase(), X(s), col[s]); col[s]+=4; doc.setDrawColor(180); doc.setLineWidth(.4); doc.line(X(s), col[s], X(s)+colW, col[s]); col[s]+=13; doc.setTextColor(0); doc.setDrawColor(0); };
  const para = (s,t,o={}) => { const size=o.size||10.5, lh=o.lh||1.3, ind=o.indent||0; doc.setFont(o.font||'times', o.style||'normal'); doc.setFontSize(size); doc.setTextColor(o.color||0); const lines=doc.splitTextToSize(String(t), colW-ind); doc.text(lines, X(s)+ind, col[s]); col[s]+=lines.length*size*lh+(o.after??4); doc.setTextColor(0); };
  const box = s => { doc.setLineWidth(.8); doc.setDrawColor(0); doc.rect(X(s), col[s]-7.5, 8, 8); };
  const rule = s => { doc.setDrawColor(170); doc.setLineWidth(.5); doc.line(X(s), col[s], X(s)+colW, col[s]); doc.setDrawColor(0); };
  label('L','1 · Read');
  for (const r of d.reading){ para('L', r.ref, {style:'bold', size:13, after:1}); para('L', r.title ? `${r.track.label} · ${r.title}` : r.track.label, {font:'helvetica', size:8, color:110, after:8}); }
  label('L','2 · Pray');
  for (const p of d.prayers){ box('L'); para('L', p.who + (p.what ? ' — ' + p.what : ''), {indent:13, after:3}); }
  for (let i=0;i<2;i++){ box('L'); col.L += 4; rule('L'); col.L += 12; }
  col.L += 4;
  label('L','3 · Memory');
  if (d.learning){ para('L', d.learning.ref + '   ' + d.learning.topic, {style:'bold', size:11, after:2}); para('L', d.learning.text, {after:6}); }
  if (d.due.length){ para('L','Review from memory:', {font:'helvetica', size:8, color:110, after:3}); for (const c of d.due){ box('L'); para('L', c.ref, {indent:13, after:3}); } }
  if (!d.learning && !d.due.length) para('L','Nothing due today.', {font:'helvetica', size:8, color:110});
  label('R','4 · Journal'); para('R', d.prompt, {style:'italic', after:8});
  for (let i=0;i<9;i++){ col.R += 12; rule('R'); col.R += 10; }
  col.R += 6;
  label('R','5 · Kids'); para('R', d.story[0], {style:'bold', size:12, after:2}); para('R', d.story[1], {after:2}); para('R','Ask them: ' + d.story[2], {font:'helvetica', size:8.5, color:90});
  if (includeText){
    let yy = Math.max(col.L, col.R) + 10;
    const size=9.2, lh=size*1.32, bottom=H-M; let x=L, top=yy;
    const put = line => { if (yy > bottom){ if (x===L){ x=R; yy=top; } else { doc.addPage(); x=L; top=M; yy=M; } } doc.text(line, x, yy); yy += lh; };
    for (const r of d.reading){
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(80); put(r.ref.toUpperCase()); doc.setTextColor(0);
      doc.setFont('times','normal'); doc.setFontSize(size);
      try {
        const tr = r.track.compare ? 'web' : (localStorage.getItem('seekfirst.tr.'+r.track.id) || 'web');
        const book = await loadBook(tr, r.track.book);
        for (const seg of r.segs){
          const verses = book[seg.c-1] || [];
          const text = verses.slice(seg.v1-1, seg.v2).map((t,i)=>`${seg.v1+i} ${t}`).join('  ');
          for (const line of doc.splitTextToSize(text, colW)) put(line);
        }
      } catch { doc.setFont('helvetica','italic'); put('Text unavailable offline.'); doc.setFont('times','normal'); }
      yy += 6;
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(120); put('World English Bible (public domain)');
  }
  return doc.output('blob');
}
async function savePdf(btn, includeText){
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const blob = await buildPdf(includeText);
    const filename = `seek-first-${dayKey()}.pdf`;
    const dl = store.downloads || (window.claude?.use ? await window.claude.use('downloads') : null);
    if (dl) await dl.save({filename, data: blob});
    else { const a = h('a',{href:URL.createObjectURL(blob), download:filename}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 10000); }
    btn.textContent = 'Saved ✓'; setTimeout(()=>{ btn.textContent = label; }, 2500);
  } catch(e){
    if (e && e.code === 'declined') btn.textContent = label;
    else { console.warn(e); btn.textContent = 'Could not save'; setTimeout(()=>{ btn.textContent = label; }, 3000); }
  } finally { btn.disabled = false; }
}

  fileIn.addEventListener('change', async ()=>{
    const f = fileIn.files && fileIn.files[0]; if (!f) return;
    try { store.restore(await f.text()); alert('Restored.'); location.hash=''; render(); }
    catch(e){ alert(e.message || 'That file could not be read.'); }
    fileIn.value = '';
  });
  const dlBackup = () => {
    const blob = new Blob([store.backup()], {type:'application/json'});
    const a = h('a',{href:URL.createObjectURL(blob), download:`seek-first-backup-${dayKey()}.json`});
    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
  };
  root.append(h('section',{}, h('h2',{},'This device'),
    h('p',{class:'muted'},'Everything lives in this browser — no account, nothing sent anywhere. Each device keeps its own copy, so move it with a backup file.'),
    h('div',{style:'margin-top:12px;max-width:280px'}, h('label',{for:'m-name'},'Your name'), nameIn),
    h('div',{class:'actions'},
      h('button',{class:'btn',onclick:dlBackup},'Download backup'),
      h('button',{class:'btn',onclick:()=>fileIn.click()},'Restore from backup'), fileIn,
      h('button',{class:'btn quiet danger',onclick:()=>{ if(confirm('Erase everything on this device? Download a backup first if you want to keep it.')){ try{ for (const k of Object.keys(localStorage)) if (k.startsWith('seekfirst.')) localStorage.removeItem(k); }catch{} location.reload(); } }},'Erase everything')),
    h('p',{class:'notice'},'On iPhone: open in Safari, tap Share, then “Add to Home Screen” to install it. Clearing Safari’s website data also clears this app — keep a backup.')));
  return root;
}

/* ====================== boot ====================== */
(function boot(){
  const saved = store.load();
  if (saved) S = migrate(saved);
  ensureToday();
  render();
  window.addEventListener('hashchange', ()=>{ stepChosen = false; render(); });
  setInterval(()=>{ if (S.today.date !== dayKey()) { stepChosen = false; render(); } }, 60000);
  if (window.claude?.use) window.claude.use('downloads').then(d=>{ store.downloads = d; }).catch(()=>{});
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
</body>
