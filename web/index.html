<style>
:root{
  --bg:#f3f4f0; --surface:#ffffff; --ink:#141a17; --ink-2:#4f5a54; --ink-3:#7d877f;
  --line:#d9ddd6; --line-2:#e8ebe6; --pine:#20372e; --pine-ink:#f3f4f0; --pine-soft:#e3eae5;
  --gold:#8a6512; --gold-fill:#f9c045; --good:#2f6b45; --danger:#9a3b2e;
  --serif:"Literata",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1a221e; --ink:#ebe8de; --ink-2:#b0b8b1; --ink-3:#7f8a82;
    --line:#2c3730; --line-2:#222c26; --pine:#2f4a3e; --pine-ink:#f3f4f0; --pine-soft:#1f2c26;
    --gold:#f9c045; --gold-fill:#f9c045; --good:#7fc39a; --danger:#e08a7c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a221e; --ink:#ebe8de; --ink-2:#b0b8b1; --ink-3:#7f8a82;
  --line:#2c3730; --line-2:#222c26; --pine:#2f4a3e; --pine-ink:#f3f4f0; --pine-soft:#1f2c26;
  --gold:#f9c045; --gold-fill:#f9c045; --good:#7fc39a; --danger:#e08a7c; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding-inline:20px;padding-block:0 64px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:140px;font-family:var(--serif);font-size:17px;line-height:1.6}
select{appearance:auto}
.wrap{max-width:620px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-block:22px 8px;border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;letter-spacing:.01em;color:var(--ink)}
.wordmark small{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:10px;letter-spacing:.02em}
.nav a,.nav button{font-size:13px;color:var(--ink-2);text-decoration:none;letter-spacing:.02em;padding:6px 0}
.nav a:hover,.nav button:hover{color:var(--ink)}
/* progress strip */
.steps{display:flex;gap:4px;padding-block:18px 6px;list-style:none;margin:0;padding-inline:0}
.steps li{flex:1;min-width:0}
.steps button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px 2px;border-radius:4px}
.steps .bar{display:block;width:100%;height:3px;background:var(--line);border-radius:2px}
.steps .lbl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.steps li.done .bar{background:var(--gold-fill)}
.steps li.cur .bar{background:var(--pine)}
.steps li.cur.done .bar{background:var(--gold-fill)}
.steps li.cur .lbl{color:var(--ink);font-weight:600}
.steps li.done .lbl::after{content:" ✓";color:var(--gold)}
/* step section */
.step{padding-block:22px 0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.2;margin:0 0 6px;text-wrap:balance;letter-spacing:-.005em}
h2{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.25;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.muted{color:var(--ink-2)}
.tiny{font-size:13px;color:var(--ink-3)}
.scripture{font-family:var(--serif);font-size:18px;line-height:1.65;max-width:62ch;margin:14px 0 0}
.scripture p{margin:0 0 .9em}
.scripture sup{font-family:var(--sans);font-size:10px;color:var(--ink-3);margin-right:4px;vertical-align:.45em;letter-spacing:0}
.scripture .chap{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:1.4em 0 .6em}
.scripture .chap:first-child{margin-top:.2em}
.verse-block{font-family:var(--serif);font-size:20px;line-height:1.55;max-width:60ch;margin:10px 0 0}
.verse-block.hidden{filter:blur(7px);user-select:none;pointer-events:none}
.ref{font-family:var(--serif);font-weight:500;font-size:24px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding-inline:8px}
.btn.quiet:hover{color:var(--ink)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--danger)}
.done-row{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.done-row .btn.primary{min-width:180px}
.list{display:flex;flex-direction:column;gap:0;margin:8px 0 0}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line-2);align-items:start}
.item:first-child{border-top:0}
.item .who{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.3}
.item .what{color:var(--ink-2);font-size:15px;line-height:1.45;max-width:58ch}
.item .meta{font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.item .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.item.prayed .who{color:var(--ink-3)}
.item.prayed .who::after{content:" ✓";color:var(--gold)}
.chip{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--pine-soft);padding:2px 8px;border-radius:999px;margin-right:6px}
.form{display:grid;gap:10px;margin-top:18px;padding:16px;border:1px dashed var(--line);border-radius:10px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.form .row{grid-template-columns:1fr}}
.form label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.empty{padding:22px 0 6px;color:var(--ink-2);font-family:var(--serif);font-size:17px;max-width:52ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:14px}
.card + .card{margin-top:10px}
.card .eyebrow{margin-bottom:2px}
.review-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.save-state{font-size:12px;color:var(--ink-3);min-width:60px;text-align:right}
.finish{padding-block:48px 20px;text-align:left}
.finish h1{font-size:34px}
.finish .verse-block{margin-top:22px}
.finish .cite{font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-top:8px;letter-spacing:.03em}
/* manage */
.manage section{padding-block:26px;border-bottom:1px solid var(--line)}
.manage section:last-child{border-bottom:0}
.manage .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:480px){.manage .row2{grid-template-columns:1fr}}
.manage label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.tms-list{display:flex;flex-direction:column}
.tms-list .series{font-family:var(--serif);font-weight:500;font-size:17px;margin:18px 0 4px}
.tms-list .series:first-child{margin-top:8px}
.tms-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:9px 0;border-top:1px solid var(--line-2);align-items:center;font-size:14px}
.tms-row .t{color:var(--ink-3);font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.tms-row .st{font-size:12px;color:var(--ink-3)}
.tms-row .st.learning{color:var(--gold)} .tms-row .st.review{color:var(--good)}
.jlist{display:flex;flex-direction:column}
.jlist details{border-top:1px solid var(--line-2);padding:8px 0}
.jlist summary{cursor:pointer;font-weight:500}
.jlist summary span{color:var(--ink-3);font-weight:400;font-size:13px;margin-left:10px}
.jlist .body{font-family:var(--serif);font-size:16px;white-space:pre-wrap;color:var(--ink-2);margin-top:8px}
.notice{font-size:13px;color:var(--ink-3);margin-top:10px}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.verse-block{transition:filter .25s ease}}
</style>

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (key,n) => { const [y,m,d]=key.split('-').map(Number); const t=new Date(y,m-1,d+n); return dayKey(t); };
const daysBetween = (a,b) => { const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5); };
const ago = key => { if(!key) return 'never'; const n=daysBetween(key,dayKey()); return n===0?'today':n===1?'yesterday':`${n} days ago`; };
const longDate = () => new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

/* ---------- state ---------- */
const defaultState = () => ({
  v:1, updatedAt:0,
  plan:{id:'nt', pos:[0], perDay:1},
  prayer:{items:[], perDay:4},
  memory:{cards:[], nextTms:0},
  kids:{pos:0},
  today:{date:'', done:{}, prayIds:[], promptShift:0, recited:false},
});
let S = defaultState();
let currentStep = 0;
let stepChosen = false;

function ensureToday(){
  const k = dayKey();
  if (S.today.date !== k) S.today = {date:k, done:{}, prayIds:[], promptShift:0, recited:false};
  if (!S.plan.pos || S.plan.pos.length !== PLANS[S.plan.id].tracks.length) S.plan.pos = PLANS[S.plan.id].tracks.map(()=>0);
}

/* ---------- storage: artifact db when present, localStorage otherwise ---------- */
const LS_STATE = 'seekfirst.state';
const store = {
  db:null, unsub:null, saveTimer:null,
  readLocal(){ try{ const s=localStorage.getItem(LS_STATE); return s?JSON.parse(s):null }catch{ return null } },
  writeLocal(){ try{ localStorage.setItem(LS_STATE, JSON.stringify(S)) }catch{} },
  async init(){
    try { this.db = window.claude?.use ? await window.claude.use('db') : null; } catch { this.db = null; }
    if (!this.db) return;
    const ref = this.db.doc('seekfirst/state');
    try {
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && (remote.updatedAt||0) >= (S.updatedAt||0)) { S = migrate(remote); ensureToday(); render(); }
      else if (S.updatedAt) { await ref.set(S); }
      this.unsub = ref.onSnapshot(sn => {
        if (!sn.exists || sn.metadata.hasPendingWrites) return;
        const d = sn.data();
        if ((d.updatedAt||0) > (S.updatedAt||0)) { S = migrate(d); ensureToday(); render(); }
      }, ()=>{});
    } catch(e) { console.warn('db unavailable', e); }
  },
  save(){
    S.updatedAt = Date.now();
    this.writeLocal();
    if (!this.db) return;
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(()=>{ this.db.doc('seekfirst/state').set(JSON.parse(JSON.stringify(S))).catch(e=>console.warn('save failed',e)); }, 400);
  },
  async loadJournal(date){
    if (this.db) { try { const s = await this.db.doc('journal/'+date).get(); return s.exists ? (s.data().text||'') : ''; } catch { return ''; } }
    try { return localStorage.getItem('seekfirst.journal.'+date) || ''; } catch { return ''; }
  },
  async saveJournal(date,text){
    try { localStorage.setItem('seekfirst.journal.'+date, text); } catch {}
    if (this.db) await this.db.doc('journal/'+date).set({date, text, updatedAt:Date.now()});
  },
  async listJournal(){
    if (this.db) { try { const q = await this.db.collection('journal').orderBy('date','desc').limit(90).get(); return q.docs.map(d=>d.data()).filter(d=>d.text&&d.text.trim()); } catch { return []; } }
    const out=[]; try { for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith('seekfirst.journal.')){ const t=localStorage.getItem(k); if(t&&t.trim()) out.push({date:k.slice(18),text:t}); } } } catch {}
    return out.sort((a,b)=>a.date<b.date?1:-1);
  }
};
function migrate(d){ const base = defaultState(); return Object.assign(base, d, {plan:{...base.plan,...d.plan}, prayer:{...base.prayer,...d.prayer}, memory:{...base.memory,...d.memory}, kids:{...base.kids,...d.kids}, today:{...base.today,...d.today}}); }

/* ---------- bible text ---------- */
const bookCache = {};
async function loadBook(b){
  if (bookCache[b]) return bookCache[b];
  const r = await fetch(`bible/${b}.json`);
  if (!r.ok) throw new Error('no text');
  return (bookCache[b] = await r.json());
}
function findBook(name){
  const n = name.trim().toLowerCase().replace(/\s+/g,' ');
  return BOOKS.find(b => b.n.toLowerCase()===n || (b.n==='Psalms' && n==='psalm'));
}
// "Exodus 7:14-24; 10:21-29", "Genesis 7-8", "Luke 2:1-20", "John 3"
function parseRef(ref){
  const out=[]; let book=null;
  for (let part of ref.split(';')){
    part = part.trim();
    const m = part.match(/^((?:[1-3]\s)?[A-Za-z ]+?)\s+(\d.*)$/);
    let rest;
    if (m) { book = findBook(m[1]); rest = m[2]; } else rest = part;
    if (!book) return null;
    const cv = rest.match(/^(\d+)(?::(\d+)(?:-(\d+))?)?(?:-(\d+))?$/);
    if (!cv) return null;
    const c1=+cv[1];
    if (cv[2]) out.push({b:book.b,c:c1,v1:+cv[2],v2:cv[3]?+cv[3]:+cv[2]});
    else { const c2 = cv[4]?+cv[4]:c1; for(let c=c1;c<=c2;c++) out.push({b:book.b,c,v1:1,v2:999}); }
  }
  return out;
}
async function renderPassage(el, segs, {chapterLabels=true}={}){
  el.innerHTML = '<p class="tiny">Loading text…</p>';
  try {
    let html='';
    for (const s of segs){
      const book = await loadBook(s.b);
      const verses = book[s.c-1] || [];
      if (chapterLabels) html += `<div class="chap">${bookName(s.b)} ${s.c}</div>`;
      html += '<p>' + verses.slice(s.v1-1, Math.min(s.v2, verses.length)).map((t,i)=>`<sup>${s.v1+i}</sup>${esc(t)}`).join(' ') + '</p>';
    }
    el.innerHTML = html + '<p class="tiny">American Standard Version</p>';
  } catch { el.innerHTML = '<p class="tiny">Text not available here — read it in your own Bible.</p>'; }
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- reading plan ---------- */
function todaysReading(){
  const plan = PLANS[S.plan.id];

  plan.tracks.forEach((t,i)=>{

    for (let k=0;k<n;k++){ const [b,c] = t.chapters[(S.plan.pos[i]+k) % t.chapters.length]; segs.push({b,c,v1:1,v2:999}); }
  });
  return segs;
}
function refLabel(segs){
  // group consecutive chapters of the same book: "Matthew 5–7"
  const parts=[]; 
  for (const s of segs){
    const last = parts[parts.length-1];
    if (last && last.b===s.b && s.v1===1 && s.v2===999 && last.c2===s.c-1) last.c2=s.c;
    else parts.push({b:s.b,c1:s.c,c2:s.c,v1:s.v1,v2:s.v2});
  }
  return parts.map(p => {
    if (p.v1===1 && p.v2===999) return `${bookName(p.b)} ${p.c1}${p.c2>p.c1?'–'+p.c2:''}`;
    return `${bookName(p.b)} ${p.c1}:${p.v1}${p.v2>p.v1?'–'+p.v2:''}`;
  }).join(' · ');
}
function advanceReading(){
  const plan = PLANS[S.plan.id];
  plan.tracks.forEach((t,i)=>{ const n = plan.tracks.length===1 ? S.plan.perDay : 1; S.plan.pos[i] = (S.plan.pos[i]+n) % t.chapters.length; });
}

/* ---------- prayer rotation ---------- */
function pickPrayers(){
  const active = S.prayer.items.filter(p=>!p.answered);
  const daily = active.filter(p=>p.daily);
  const rest = active.filter(p=>!p.daily).sort((a,b)=> (a.lastPrayed||'') < (b.lastPrayed||'') ? -1 : (a.lastPrayed||'') > (b.lastPrayed||'') ? 1 : a.added < b.added ? -1 : 1);
  return [...daily, ...rest.slice(0, Math.max(0, S.prayer.perDay))].map(p=>p.id);
}
function ensurePrayerSelection(){
  const validIds = new Set(S.prayer.items.filter(p=>!p.answered).map(p=>p.id));
  S.today.prayIds = (S.today.prayIds||[]).filter(id=>validIds.has(id));
  if (S.today.prayIds.length===0 && validIds.size) S.today.prayIds = pickPrayers();
}
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- memory (topical memory system) ---------- */
function ensureLearningCard(){
  if (S.memory.cards.some(c=>c.status==='learning')) return;
  while (S.memory.nextTms < TMS.length && S.memory.cards.some(c=>c.tms===S.memory.nextTms)) S.memory.nextTms++;
  if (S.memory.nextTms >= TMS.length) return;
  const v = TMS[S.memory.nextTms];
  S.memory.cards.push({id:uid(), tms:S.memory.nextTms, ref:v.ref, text:v.text, topic:v.topic, series:v.series, status:'learning', reps:0, lastRep:'', interval:0, due:'', added:dayKey()});
  S.memory.nextTms++;
}
function dueReviews(){ const k=dayKey(); return S.memory.cards.filter(c=>c.status==='review' && c.due && c.due<=k).sort((a,b)=>a.due<b.due?-1:1); }
function promoteToReview(card, interval=1){ card.status='review'; card.interval=interval; card.due=addDays(dayKey(),interval); }
function gradeReview(card, ok){
  const k = dayKey();
  if (ok) { card.interval = Math.max(1, Math.round((card.interval||1) * 2.2)); card.due = addDays(k, Math.min(card.interval, 120)); card.reps=(card.reps||0)+1; }
  else { card.interval = 1; card.due = addDays(k,1); }
  card.lastRep = k;
}

/* ---------- rendering ---------- */
const app = document.getElementById('app');
const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k==='class') el.className=v; else if (k==='html') el.innerHTML=v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v===false||v==null) {} else el.setAttribute(k, v===true?'':v);
  }
  for (const c of kids.flat()) if (c!=null) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
};

function render(){

function renderToday(){
  ensurePrayerSelection();
  ensureLearningCard();
  const doneCount = STEPS.filter(s=>S.today.done[s.id]).length;
  if (!stepChosen) { const first = STEPS.findIndex(s=>!S.today.done[s.id]); currentStep = first<0 ? STEPS.length : first; }
  const frag = document.createDocumentFragment();

  const strip = h('ol',{class:'steps'}, STEPS.map((s,i)=> h('li',{class:(S.today.done[s.id]?'done ':'')+(i===currentStep?'cur':'')},
    h('button',{onclick:()=>{ currentStep=i; stepChosen=true; render(); }, 'aria-label':s.label+(S.today.done[s.id]?', done':'')}, h('span',{class:'bar'}), h('span',{class:'lbl'}, s.label)))));
  frag.append(strip);

  if (currentStep >= STEPS.length || (doneCount===STEPS.length && !stepChosen)) { frag.append(renderFinish()); return frag; }
  const step = STEPS[currentStep].id;
  const body = {read:renderRead, pray:renderPray, memory:renderMemory, journal:renderJournal, kids:renderKids}[step]();

    } else {
      side.append(h('button',{class:'btn sm quiet danger',onclick:()=>{ S.memory.cards=S.memory.cards.filter(x=>x.id!==c.id); if(i<S.memory.nextTms) S.memory.nextTms=Math.min(S.memory.nextTms,i); store.save(); render(); }}, 'Reset'));
    }
    tl.append(h('div',{class:'tms-row'}, h('div',{}, h('div',{class:'t'}, v.topic), h('div',{}, v.ref, ' ', h('span',{class:'st '+(c?c.status:'')}, c&&c.status==='paused' ? 'paused' : status))), side));
  });
  const customs = S.memory.cards.filter(c=>c.tms==null);
  const cref = h('input',{id:'m-cref',placeholder:'Reference, e.g. Psalm 23:1'}); const ctext = h('textarea',{id:'m-ctext',placeholder:'Verse text',style:'min-height:90px'});
  const addCustom = () => { if(!cref.value.trim()||!ctext.value.trim()) return; S.memory.cards.push({id:uid(),tms:null,ref:cref.value.trim(),text:ctext.value.trim(),topic:'Custom',series:'',status:'review',reps:0,lastRep:'',interval:1,due:dayKey(),added:dayKey()}); cref.value=''; ctext.value=''; store.save(); render(); };
  root.append(h('section',{}, h('h2',{},'Memory verses'),
    h('p',{class:'muted'}, `${S.memory.cards.filter(c=>c.status==='review').length} in review · ${S.memory.cards.filter(c=>c.status==='learning').length} learning. Sixty verses in five series, patterned after the Navigators’ Topical Memory System. Mark the ones you already know so they enter the review rotation.`),
    tl,
    customs.length ? h('div',{style:'margin-top:22px'}, h('h3',{},'Your own verses'), h('div',{class:'list'}, customs.map(c=>h('div',{class:'item'}, h('div',{}, h('div',{class:'who'},c.ref), h('div',{class:'what'},c.text), h('div',{class:'meta'},`review · due ${c.due}`)), h('div',{class:'side'}, h('button',{class:'btn sm quiet danger',onclick:()=>{ S.memory.cards=S.memory.cards.filter(x=>x.id!==c.id); store.save(); render(); }},'Remove')))))) : null,
    h('div',{class:'form'}, h('h3',{},'Add your own verse'), h('div',{}, h('label',{for:'m-cref'},'Reference'), cref), h('div',{}, h('label',{for:'m-ctext'},'Text'), ctext), h('div',{}, h('button',{class:'btn sm',onclick:addCustom},'Add to review')))));

  // kids
  const ksel = h('select',{id:'m-kids'}, STORIES.map((s,i)=>h('option',{value:i,selected:i===S.kids.pos%STORIES.length},`${i+1}. ${s[0]} — ${s[1]}`)));
  ksel.addEventListener('change',()=>{ S.kids.pos=+ksel.value; store.save(); });
  root.append(h('section',{}, h('h2',{},'Kids’ stories'), h('label',{for:'m-kids'},'Next story'), ksel, h('p',{class:'notice'}, `${STORIES.length} stories from Genesis to Revelation, in order. Read from any Bible or story Bible — the reference is the anchor.`)));

  // journal
  const jl = h('div',{class:'jlist'}, h('p',{class:'tiny'},'Loading…'));
  store.listJournal().then(entries=>{ jl.replaceChildren(); if(!entries.length){ jl.append(h('p',{class:'empty'},'No entries yet.')); return; } for (const e of entries) jl.append(h('details',{}, h('summary',{}, e.date, h('span',{}, e.text.slice(0,60).replace(/\s+/g,' ')+(e.text.length>60?'…':''))), h('div',{class:'body'}, e.text))); });
  root.append(h('section',{}, h('h2',{},'Journal'), jl));

  root.append(h('section',{}, h('p',{class:'tiny'}, store.db ? 'Saved to this page’s private store; open it on any device.' : 'Saved in this browser only.')));
  return root;
}

/* ---------- boot ---------- */
(function boot(){
  const local = store.readLocal();
  if (local) S = migrate(local);
  ensureToday();
  render();
  window.addEventListener('hashchange', ()=>{ stepChosen=false; render(); });
  store.init();
  // roll over at midnight if the page is left open
  setInterval(()=>{ if (S.today.date !== dayKey()) { stepChosen=false; render(); } }, 60000);
})();
</script>
